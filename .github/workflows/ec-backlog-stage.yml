name: EC reviewed protocols staging
on:
  push:
    branches: [codex/ec-backlog-2026-10-28]
    paths: ['docs/extinction-city/review-code.*', '.github/workflows/ec-backlog-stage.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/ec-backlog-2026-10-28'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /.github/workflows/
            /docs/extinction-city/
            **/*.json
            **/*.jsonl
            /public/images/campaign-oc/chapter-01-atrium-v1.png
            /public/sprites/generated/heroes/nexus-de-convergence/
            /public/sprites/generated/heroes/kaamelott/arthur-kaamelott-complete/
            /public/sprites/generated/heroes/system-of-a-down/serj-tankian-complete/
            /public/backgrounds/lore-stages/nexus-de-convergence/rpg.webp
      - name: Validate exact reviewed source and patch hashes
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          out=Path('/tmp/ec-stage');out.mkdir(exist_ok=True)
          m=json.loads(Path('docs/extinction-city/review-code.json').read_text())
          allowed={'.github/workflows/ec-protocols.yml','src/components/HubScreen.jsx','src/components/HubImmersion.css','src/game/extinctionSignatures.js','src/game/mosaicExhibits.js','scripts/extinctionSignatures.test.mjs','scripts/mosaicExhibits.test.mjs','scripts/extinctionTiming.test.mjs','scripts/mosaicCityRuntime.test.mjs','scripts/extinctionCityCatalog.test.mjs','scripts/browserExtinctionProtocols.py','scripts/extinction-city/catalog.mjs','scripts/extinction-city/build_workbook.py'}
          assert len(m['files'])==13 and {f['path'] for f in m['files']}==allowed
          for f in m['files']:
              p=Path(f['path']);assert not p.is_symlink()
              assert (hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None)==f['before'],f['path']
          parts=sorted(Path('docs/extinction-city').glob('review-code.part*'));assert len(parts)==7
          encoded=''.join(p.read_text().strip() for p in parts)
          encoded=encoded.replace('DV3HXbFiaKQi1','DV3TdFqmWJzu6xDDu5XXRKk6Qi1')
          patch=gzip.decompress(base64.b64decode(encoded,validate=True))
          assert len(patch)<200000 and hashlib.sha256(patch).hexdigest()==m['patchSha256']
          Path('/tmp/ec.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/ec.patch'],check=True)
          subprocess.run(['git','apply','/tmp/ec.patch'],check=True)
          for f in m['files']:assert hashlib.sha256(Path(f['path']).read_bytes()).hexdigest()==f['after'],f['path']
          (out/'manifest.json').write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit contracts, lint and source compilation
        run: |
          set -euo pipefail
          git ls-files > TRACKED_FILES.txt
          node --test scripts/sceneInputs.test.mjs scripts/extinctionTiming.test.mjs scripts/mosaicCityRuntime.test.mjs scripts/immersiveHubState.test.mjs scripts/extinctionContent.test.mjs scripts/mosaicUniversePlaces.test.mjs scripts/scenePresentation.test.mjs scripts/mosaicResidents.test.mjs scripts/mosaicResidentNavigation.test.mjs scripts/extinctionViewmodelContract.test.mjs scripts/extinctionSignatures.test.mjs scripts/mosaicExhibits.test.mjs | tee /tmp/ec-stage/targeted.log
          node --no-warnings --loader ./scripts/sourceSceneTestLoader.mjs --test scripts/extinctionCityCatalog.test.mjs | tee /tmp/ec-stage/catalog.log
          npm run test:ui-immersion | tee /tmp/ec-stage/ui.log
          npx oxlint --max-warnings 0 src/components/HubScreen.jsx src/game/extinctionSignatures.js src/game/mosaicExhibits.js scripts/extinctionSignatures.test.mjs scripts/mosaicExhibits.test.mjs scripts/extinction-city/catalog.mjs scripts/extinctionCityCatalog.test.mjs | tee /tmp/ec-stage/lint.log
          npx vite build | tee /tmp/ec-stage/build.log
      - name: Chromium protocols, display approaches and previous FPS regressions
        run: |
          set -euo pipefail
          python3 -m venv /tmp/ec-browser
          /tmp/ec-browser/bin/pip install playwright==1.57.0
          /tmp/ec-browser/bin/python -m playwright install --with-deps chromium
          npm run dev -- --host 127.0.0.1 --port 4173 --strictPort >/tmp/ec-stage/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          /tmp/ec-browser/bin/python scripts/browserExtinctionProtocols.py --evidence /tmp/ec-stage/protocols | tee /tmp/ec-stage/browser.log
          /tmp/ec-browser/bin/python scripts/browserExtinctionCatalog.py --require-art --evidence /tmp/ec-stage/previous | tee /tmp/ec-stage/previous.log
      - name: Store verified Git objects only, never update a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          m=json.loads(Path('/tmp/ec-stage/manifest.json').read_text());blobs=[]
          for f in m['files']:
              raw=Path(f['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==f['after']
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/multiverse-breach/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ec-protocols-review'})
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              assert result['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              blobs.append({'path':f['path'],'mode':'100644','type':'blob','sha':result['sha']})
          Path('/tmp/ec-stage/blobs.json').write_text(json.dumps(blobs,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ec-protocols-staged-${{ github.sha }}
          path: /tmp/ec-stage/
          retention-days: 14
