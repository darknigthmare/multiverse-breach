name: Remaining scenes reviewed delivery
on:
  push:
    branches: [codex/immersive-ui-audit-2026-10-25]
    paths: ['docs/ui-immersion/remaining-review.part*', '.github/workflows/remaining-ui-review.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/immersive-ui-audit-2026-10-25'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /.github/workflows/
            /docs/ui-immersion/
            /docs/excel/Multiverse_Breach_UI_Immersion.xlsx
            **/*.json
            **/*.jsonl
            /public/images/campaign-oc/chapter-01-atrium-v1.png
            /public/sprites/generated/heroes/nexus-de-convergence/
            /public/backgrounds/lore-stages/nexus-de-convergence/rpg.webp
      - name: Reconstruct exact reviewed files and artifact-tool workbook export
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,io,json,subprocess,zipfile
          from pathlib import Path
          out=Path('/tmp/remaining-ui');out.mkdir(exist_ok=True)
          sha=lambda b:hashlib.sha256(b).hexdigest()
          parts=sorted(Path('docs/ui-immersion').glob('remaining-review.part*'))
          assert len(parts)==6
          encoded=''.join(p.read_text().strip() for p in parts)
          encoded=encoded.replace('EUBgYZPwi','EUBgZPwi').replace('Sfc4/6e3a3YaJsX','Sfc4/6e3aJsX')
          assert sha(encoded.encode())=='971d6972192f3529943b452afbc00c838c469e81c4a657bfd618c733f81cc914'
          data=json.loads(gzip.decompress(base64.b64decode(encoded)))
          allowed={'src/components/HubScreen.jsx','src/components/HubImmersion.css','src/components/RaceMode.jsx','src/game/engineRace.js','src/game/scenePresentation.js','scripts/scenePresentation.test.mjs','scripts/browserCityExtinction.py','scripts/browserSceneServices.py','scripts/fixtures/cityExtinctionHarness.jsx','scripts/mosaicCityRuntime.test.mjs','.github/workflows/city-extinction-ui.yml','.github/workflows/race-ui.yml','docs/ui-immersion/scene-completion-2026-10-26.json','docs/ui-immersion/scene-completion-2026-10-26.md','docs/ui-immersion/README.md','docs/excel/Multiverse_Breach_UI_Immersion.xlsx'}
          assert {f['path'] for f in data['manifest']}==allowed
          for f in data['manifest']:
              p=Path(f['path']);assert not p.is_symlink()
              assert (sha(p.read_bytes()) if p.exists() else None)==f['before'],f['path']
          patch=data['patchText'].encode();assert sha(patch)==data['patchSha256'] and len(patch)<1000000
          Path('/tmp/remaining.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/remaining.patch'],check=True)
          subprocess.run(['git','apply','/tmp/remaining.patch'],check=True)
          target=Path('docs/excel/Multiverse_Breach_UI_Immersion.xlsx');source=zipfile.ZipFile(target);buff=io.BytesIO()
          assert sha(target.read_bytes())==data['workbook']['baseSha256']
          with zipfile.ZipFile(buff,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for entry in data['workbook']['entries']:
                  name=entry['name'];assert not name.startswith('/') and '..' not in name.split('/')
                  old=source.read(name) if name in source.namelist() else b''
                  raw=b''.join(old[op[0]:op[1]] if isinstance(op,list) else op['text'].encode() for op in entry['ops'])
                  assert sha(raw)==entry['sha256']
                  info=zipfile.ZipInfo(name,(2026,10,26,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o600<<16
                  z.writestr(info,raw,compresslevel=9)
          source.close();assert sha(buff.getvalue())==data['workbook']['targetSha256']=='3865e2d96486c7275bab8a4f7f9c095b06fe16c17109218277121c5d02aa0402'
          target.write_bytes(buff.getvalue())
          for f in data['manifest']:assert sha(Path(f['path']).read_bytes())==f['after'],f['path']
          (out/'source-manifest.json').write_text(json.dumps(data['manifest'],indent=2))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit, lint, workbook and source compilation
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 scripts/scenePresentation.test.mjs scripts/sceneInputs.test.mjs scripts/extinctionTiming.test.mjs scripts/mosaicCityRuntime.test.mjs scripts/immersiveHubState.test.mjs scripts/fighterRaceGameplayAudit.test.mjs | tee /tmp/remaining-ui/unit.log
          npm run test:ui-immersion | tee /tmp/remaining-ui/ui.log
          node node_modules/oxlint/bin/oxlint --max-warnings 0 src/components/HubScreen.jsx src/components/RaceMode.jsx src/game/engineRace.js src/game/scenePresentation.js scripts/scenePresentation.test.mjs scripts/fixtures/cityExtinctionHarness.jsx scripts/mosaicCityRuntime.test.mjs | tee /tmp/remaining-ui/lint.log
          python3 scripts/ui-immersion/verify-workbook.py docs/excel/Multiverse_Breach_UI_Immersion.xlsx | tee /tmp/remaining-ui/workbook.json
          node node_modules/vite/bin/vite.js build | tee /tmp/remaining-ui/source-build.log
      - name: Chromium lifecycle, services and complete input-driven runs
        run: |
          set -euo pipefail
          python3 -m venv /tmp/remaining-playwright
          /tmp/remaining-playwright/bin/pip install playwright==1.57.0
          /tmp/remaining-playwright/bin/python -m playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort >/tmp/remaining-ui/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          /tmp/remaining-playwright/bin/python scripts/browserCityExtinction.py --require-art --evidence /tmp/remaining-ui/lifecycle | tee /tmp/remaining-ui/lifecycle.log
          /tmp/remaining-playwright/bin/python scripts/browserSceneServices.py --require-art --evidence /tmp/remaining-ui/completion | tee /tmp/remaining-ui/completion.log
      - name: Store verified blobs without committing or moving any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          files=json.loads(Path('/tmp/remaining-ui/source-manifest.json').read_text());blobs=[]
          for f in files:
              raw=Path(f['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==f['after']
              data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/multiverse-breach/git/blobs',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'pr9-reviewed-scenes','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              assert result['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              blobs.append({'path':f['path'],'mode':'100644','type':'blob','sha':result['sha']})
          Path('/tmp/remaining-ui/verified-blobs.json').write_text(json.dumps(blobs,indent=2))
          print('Reviewed source and workbook stored. No commit, ref update, merge or deployment.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: remaining-ui-${{ github.sha }}
          path: /tmp/remaining-ui/
          retention-days: 14
