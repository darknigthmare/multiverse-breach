name: City and Extinction review inputs
on:
  push:
    branches: [codex/immersive-ui-audit-2026-10-25]
    paths: ['.github/workflows/city-extinction-review-inputs.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /.github/workflows/
            /docs/ui-immersion/
            /docs/excel/Multiverse_Breach_UI_Immersion.xlsx
            **/*.json
            **/*.jsonl
            /public/images/campaign-oc/chapter-01-atrium-v1.png
            /public/sprites/generated/heroes/nexus-de-convergence/
            /public/sprites/openai-backgrounds/nexus-de-convergence*
      - name: Archive tracked review inputs only
        run: |
          python3 - <<'PY'
          import json,subprocess,zipfile
          from pathlib import Path
          output=Path('/tmp/city-extinction-inputs');output.mkdir()
          tracked=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile(output/'source.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in tracked:
                  p=Path(name)
                  if name and p.is_file() and not p.is_symlink() and (name.startswith(('src/','scripts/','api/','.github/workflows/','docs/ui-immersion/','public/')) or name=='docs/excel/Multiverse_Breach_UI_Immersion.xlsx' or '/' not in name):
                      if p.suffix in {'.js','.jsx','.mjs','.cjs','.ts','.tsx','.json','.jsonl','.css','.html','.md','.py','.sh','.yml','.yaml','.xlsx','.png','.webp','.jpg','.log'}:z.write(p,name)
              z.writestr('REVIEW_COMMIT.txt',subprocess.check_output(['git','rev-parse','HEAD']))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: city-extinction-inputs-${{ github.sha }}
          path: /tmp/city-extinction-inputs/
          retention-days: 7
