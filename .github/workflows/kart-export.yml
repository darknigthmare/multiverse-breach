name: Materialize character kart exports
on:
  push:
    branches: [feat/kart-3d-universes-2026-11-08]
    paths: [.github/workflows/kart-export.yml]
permissions:
  contents: write
jobs:
  export:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/feat/kart-3d-universes-2026-11-08'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /config/
            /DLC/
            !/DLC/*/assets/
            /DLC/*/assets/**/*.json
            /docs/kart/
            **/*.json
            **/*.jsonl
            /public/kart/
            /public/sprites/generated/heroes/nexus-de-convergence/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild and verify all character exports
        run: |
          set -euo pipefail
          node scripts/kart/buildKartAssets.mjs --all
          node scripts/kart/buildKartAssets.mjs --check
          node --test scripts/kartModels.test.mjs scripts/kart/kartLivery.test.mjs
          git add --sparse -- DLC public/kart docs/kart/kart-assets.json
          node scripts/buildDlcAssetManifests.mjs --write
          git add --sparse -- DLC .gitignore .vercelignore
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || git commit -m 'build(kart): materialize verified character models and sprite atlases'
          git push origin HEAD:refs/heads/feat/kart-3d-universes-2026-11-08
