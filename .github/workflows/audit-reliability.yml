name: Reliability and source build
on:
  pull_request:
  push:
    branches: [master, codex/audit-corrections-2026-10-16]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /supabase/
            /.github/workflows/
            **/*.json
            **/*.jsonl
            **/*.md
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Derived index contract and reliability tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/reliability-evidence
          npm run sprites:availability:check
          npm run test:audit-reliability | tee /tmp/reliability-evidence/reliability.log
          npm run test:audit-followup | tee /tmp/reliability-evidence/followup.log
          npm run test:audit-combat | tee /tmp/reliability-evidence/combat-regressions.log
          npm run test:audit-tactics | tee /tmp/reliability-evidence/tactics-regressions.log
          npm run test:polish | tee /tmp/reliability-evidence/polish.log
      - name: Immersive UI and progression preservation
        run: |
          set -euo pipefail
          npm run test:ui-immersion | tee /tmp/reliability-evidence/ui-immersion.log
      - name: Reaudit regression contracts
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/reliability-evidence/tested-commit.txt
          sha256sum src/game/engineFighter.js src/game/fighterControlOwnership.js src/components/FighterMode.jsx scripts/reauditFighterInputs.test.mjs scripts/fixedStepClock.test.mjs scripts/browserFighterLifecycle.py package.json .github/workflows/audit-reliability.yml docs/audits/pr4-fighter-controls-2026-10-19.md > /tmp/reliability-evidence/fighter-controls.sha256
          npm run test:reaudit | tee /tmp/reliability-evidence/reaudit.log
      - name: Existing combat and save contracts
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 scripts/combatEffectRegressions.test.mjs scripts/tacticsMissionObjectives.test.mjs scripts/customBattle.test.mjs scripts/canonRexAttackPatterns.test.mjs scripts/localSaveGuard.test.mjs scripts/cloudSaveConflictPolicy.test.mjs scripts/smashCanonAbilityProfiles.test.mjs scripts/smashObjectiveResolution.test.mjs scripts/canonEncounterExternalDamage.test.mjs scripts/rpgTargeting.test.mjs scripts/rpgTargetingPresentation.test.mjs scripts/canonRaamEncounter.test.mjs scripts/canonPiratesCurseEncounter.test.mjs scripts/canonPiratesPlayableJackCurse.test.mjs scripts/portalBoosterEngine.test.mjs scripts/portalBoosterEconomy.test.mjs | tee /tmp/reliability-evidence/existing-contracts.log
      - name: Lint reaudit changes
        run: >-
          node node_modules/oxlint/bin/oxlint --max-warnings 0
          src/game/tacticsAttackCommitment.js scripts/fixtures/tacticsAttackHarness.jsx src/game/tacticsSourceHealing.js scripts/fixtures/tacticsHealingHarness.jsx src/game/stockMedicModes.js src/game/fighterHealing.js src/game/fighterMeleeSignatures.js src/game/fighterRangedSignatures.js src/game/combatActivity.js src/game/rpgActionEconomy.js src/game/rpgActionCommitment.js
          src/game/engineFighter.js src/game/fighterControlOwnership.js src/game/originalUniverseProduction.js src/components/BuildIdentity.jsx
          src/components/FighterMode.jsx scripts/fixtures/fighterLifecycleHarness.jsx scripts/fixtures/fighterMeleeHarness.jsx scripts/fixtures/fighterRangedHarness.jsx
          src/components/TacticsSupportPanel.jsx scripts/reaudit*.test.mjs scripts/tacticsFacingRuntime.test.mjs
          scripts/buildIdentity.mjs scripts/progressionAudit.mjs vite.config.js
      - name: Lint changed modules and tests
        run: >-
          node node_modules/oxlint/bin/oxlint
          src/App.jsx src/components/AuthPanel.jsx src/components/GameCanvas.jsx src/components/HubScreen.jsx
          src/game/cloudSave.js src/game/cloudTransport.js src/game/cloudOperationEpoch.js
          src/game/progressCalendar.js src/game/safeStorage.js src/game/saveRecovery.js src/game/saveValidation.js
          src/game/localSaveGuard.js src/game/engineTactics.js src/game/engineSmash.js src/game/combatHealing.js
          src/main.jsx src/components/AppBootstrap.jsx src/components/AuthCallbackScreen.jsx src/game/authRecovery.js
          scripts/auditAuthRecovery.test.mjs scripts/auditFollowupRegressions.test.mjs scripts/progressionRuntimeIntegration.test.mjs
          scripts/auditApplicationIntegration.test.mjs scripts/auditCloudReliability.test.mjs
          scripts/auditCombatReliability.test.mjs scripts/auditSaveCalendar.test.mjs scripts/auditSpriteAvailability.test.mjs
          src/game/tacticsSupport.js src/components/TacticsSupportPanel.jsx scripts/auditTacticsReliability.test.mjs scripts/auditTacticsLifecycle.test.mjs scripts/auditTacticsSupport.test.mjs scripts/fixtures/tacticsLifecycleHarness.jsx
          src/game/engineRpg.js src/game/rpgTargeting.js src/game/rpgSupport.js src/game/combatEventItem.js
          src/game/portalBoosterEngine.js src/components/PortalScreen.jsx src/components/RpgTargetingPanel.jsx
          scripts/auditRpgLifecycle.test.mjs scripts/auditEventConsumption.test.mjs scripts/fixtures/rpgLifecycleHarness.jsx
          scripts/buildSpriteAvailability.mjs scripts/canonRexAttackPatterns.test.mjs
          scripts/cloudReconciliationRace.test.mjs scripts/combatEffectRegressions.test.mjs scripts/customBattle.test.mjs
      - name: Compile source snapshot (not full artwork publication)
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js build | tee /tmp/reliability-evidence/source-build.log
          echo 'This job checks source and JSON manifests. The unchanged full production prebuild remains responsible for artwork/audio validation.' >> "$GITHUB_STEP_SUMMARY"
      - name: Browser RPG, Tactics and authentication regressions (isolated fixtures)
        run: |
          set -euo pipefail
          python3 -m venv /tmp/multiverse-playwright
          /tmp/multiverse-playwright/bin/pip install playwright==1.57.0
          /tmp/multiverse-playwright/bin/python -m playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort > /tmp/reliability-evidence/browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          /tmp/multiverse-playwright/bin/python scripts/browserAuditFollowup.py --evidence /tmp/reliability-evidence/browser | tee /tmp/reliability-evidence/browser.log
          /tmp/multiverse-playwright/bin/python scripts/browserRpgLifecycle.py --evidence /tmp/reliability-evidence/rpg-browser | tee /tmp/reliability-evidence/rpg-browser.log
          /tmp/multiverse-playwright/bin/python scripts/browserTacticsReliability.py --evidence /tmp/reliability-evidence/tactics-browser | tee /tmp/reliability-evidence/tactics-browser.log
          /tmp/multiverse-playwright/bin/python scripts/browserFighterLifecycle.py --evidence /tmp/reliability-evidence/fighter-browser | tee /tmp/reliability-evidence/fighter-browser.log
          /tmp/multiverse-playwright/bin/python scripts/browserTacticsHealing.py --evidence /tmp/reliability-evidence/tactics-healing-browser | tee /tmp/reliability-evidence/tactics-healing-browser.log
          /tmp/multiverse-playwright/bin/python scripts/browserTacticsAttack.py --evidence /tmp/reliability-evidence/tactics-attack-browser | tee /tmp/reliability-evidence/tactics-attack-browser.log
          /tmp/multiverse-playwright/bin/python scripts/browserFighterHealing.py --evidence /tmp/reliability-evidence/fighter-healing-browser | tee /tmp/reliability-evidence/fighter-healing-browser.log
          /tmp/multiverse-playwright/bin/python scripts/browserFighterMelee.py --evidence /tmp/reliability-evidence/fighter-melee-browser | tee /tmp/reliability-evidence/fighter-melee-browser.log
          /tmp/multiverse-playwright/bin/python scripts/browserFighterRanged.py --evidence /tmp/reliability-evidence/fighter-ranged-browser | tee /tmp/reliability-evidence/fighter-ranged-browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reliability-${{ github.sha }}
          path: /tmp/reliability-evidence/
          retention-days: 7
