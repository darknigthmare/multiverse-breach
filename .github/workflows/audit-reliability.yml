name: Reliability and source build
on:
  pull_request:
  push:
    branches: [master, codex/audit-corrections-2026-10-16]
permissions:
  contents: read
concurrency:
  group: reliability-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /supabase/
            **/*.json
            **/*.jsonl
            **/*.md
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Derived index contract and reliability tests
        run: |
          set -euo pipefail
          mkdir -p /tmp/reliability-evidence
          npm run sprites:availability:check
          npm run test:audit-reliability | tee /tmp/reliability-evidence/reliability.log
      - name: Existing combat and save contracts
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 scripts/combatEffectRegressions.test.mjs scripts/tacticsMissionObjectives.test.mjs scripts/customBattle.test.mjs scripts/canonRexAttackPatterns.test.mjs scripts/localSaveGuard.test.mjs scripts/cloudSaveConflictPolicy.test.mjs | tee /tmp/reliability-evidence/existing-contracts.log
      - name: Lint changed modules and tests
        run: >-
          node node_modules/oxlint/bin/oxlint
          src/App.jsx src/components/AuthPanel.jsx src/components/GameCanvas.jsx src/components/HubScreen.jsx
          src/game/cloudSave.js src/game/cloudTransport.js src/game/cloudOperationEpoch.js
          src/game/progressCalendar.js src/game/safeStorage.js src/game/saveRecovery.js src/game/saveValidation.js
          src/game/localSaveGuard.js src/game/engineTactics.js
          scripts/auditApplicationIntegration.test.mjs scripts/auditCloudReliability.test.mjs
          scripts/auditCombatReliability.test.mjs scripts/auditSaveCalendar.test.mjs scripts/auditSpriteAvailability.test.mjs
          scripts/buildSpriteAvailability.mjs scripts/canonRexAttackPatterns.test.mjs
          scripts/cloudReconciliationRace.test.mjs scripts/combatEffectRegressions.test.mjs scripts/customBattle.test.mjs
      - name: Compile source snapshot (not full artwork publication)
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js build | tee /tmp/reliability-evidence/source-build.log
          echo 'This job checks source and JSON manifests. The unchanged full production prebuild remains responsible for artwork/audio validation.' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reliability-${{ github.sha }}
          path: /tmp/reliability-evidence/
          retention-days: 7
