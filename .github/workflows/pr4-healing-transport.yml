name: PR4 verified tactical healing patch
on:
  push:
    branches: [codex/pr4-readback-2026-10-19-1145]
    paths: [.github/workflows/pr4-healing-transport.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.audit/
            /src/
            /scripts/
            /.github/workflows/
            /docs/audits/
      - name: Verify source changes only; workflow changes require the connected GitHub writer
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path
          m = json.loads(Path('.audit/healing-manifest.json').read_text())
          assert m['base'] == 'de00b8806f76b996f034f057afcb4642617bd05a'
          assert m['patchSha256'] == '7e993ef7c93bdc2a52931d3a76880c0e7477d0c50ef9c51ea97551ba0f3515d0'
          raw = ''.join(Path(f'.audit/healing.part{i}').read_text() for i in range(2))
          patch = lzma.decompress(base64.b64decode(raw, validate=True))
          assert hashlib.sha256(patch).hexdigest() == m['patchSha256']
          assert len(m['files']) == 11
          assert all(not Path(p).is_absolute() and '..' not in Path(p).parts for p in m['files'])
          Path('/tmp/healing.patch').write_bytes(patch)
          Path('/tmp/healing-manifest.json').write_text(json.dumps(m))
          PY
          git fetch --no-tags --depth=1 origin de00b8806f76b996f034f057afcb4642617bd05a
          git checkout --detach de00b8806f76b996f034f057afcb4642617bd05a
          git apply --index /tmp/healing.patch
          git restore --source=HEAD --staged --worktree .github/workflows/audit-reliability.yml
          git diff --cached --check
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          m = json.loads(Path('/tmp/healing-manifest.json').read_text())
          del m['files']['.github/workflows/audit-reliability.yml']
          actual = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().strip('\0').split('\0')
          assert sorted(actual) == sorted(m['files']) and len(actual) == 10
          assert all(not p.startswith('.github/') for p in actual)
          for p, expected in m['files'].items():
              assert hashlib.sha256(Path(p).read_bytes()).hexdigest() == expected, p
          print('All 10 source files match their tested SHA-256 values; workflows unchanged.')
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(tactics): integrate Healing Wind and refresh support targets before commitment'
          test "$(git rev-parse HEAD^)" = de00b8806f76b996f034f057afcb4642617bd05a
          git push origin HEAD:refs/heads/codex/pr4-tactics-healing-ready-2026-10-19
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
