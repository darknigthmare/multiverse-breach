name: Race reviewed delivery
on:
  push:
    branches: [codex/immersive-ui-audit-2026-10-25]
    paths: ['docs/ui-immersion/race-delivery.part*', '.github/workflows/race-reviewed-delivery.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/immersive-ui-audit-2026-10-25'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /.github/workflows/
            /docs/ui-immersion/
            /docs/excel/Multiverse_Breach_UI_Immersion.xlsx
            **/*.json
            **/*.jsonl
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-directions.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-actions.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-items.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-hud-icons.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-hud-avatar.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-hud-garage.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-track-nexus.png
      - name: Reassemble exact reviewed sources and exported workbook
        run: |
          python3 - <<'PY'
          import base64,hashlib,io,json,lzma,zipfile
          from pathlib import Path
          out=Path('/tmp/race-delivery');out.mkdir(parents=True,exist_ok=True)
          encoded=''.join(p.read_text().strip() for p in sorted(Path('docs/ui-immersion').glob('race-delivery.part*')))
          raw=lzma.decompress(base64.b64decode(encoded))
          digest=lambda b:hashlib.sha256(b).hexdigest()
          assert len(raw)<2000000 and digest(raw)=='06cbf25bbf91373addede4e03ee957af5215f3ba2746cf75713822ea7aeb7734'
          m=json.loads(raw)
          allowed={'src/components/RaceMode.jsx','src/components/HubImmersion.css','src/game/raceSessionControls.js','scripts/raceSessionControls.test.mjs','scripts/fixedStepClock.test.mjs','scripts/immersiveHubState.test.mjs','scripts/fixtures/raceLifecycleHarness.jsx','scripts/fixtures/race-lifecycle.html','scripts/browserRaceImmersion.py','.github/workflows/race-ui.yml','docs/ui-immersion/race-continuation-2026-10-26.json','docs/ui-immersion/evidence/race-unit-final.log','docs/ui-immersion/evidence/race-browser-final.log','docs/ui-immersion/evidence/race-browser-results.json'}
          assert {f['path'] for f in m['files']}==allowed
          apply=lambda old,ops:b''.join(old[o[0]:o[1]] if isinstance(o,list) else base64.b64decode(o) for o in ops)
          manifest=[]
          for f in m['files']:
              p=Path(f['path']);assert not p.is_symlink()
              old=p.read_bytes() if p.exists() else None
              assert (digest(old) if old is not None else None)==f['before'],str(p)
              result=apply(old or b'',f['ops']);assert digest(result)==f['after'],str(p)
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(result)
              manifest.append({'path':str(p),'sha256':f['after']})
          f=m['workbook'];p=Path(f['path']);assert str(p)=='docs/excel/Multiverse_Breach_UI_Immersion.xlsx'
          assert digest(p.read_bytes())==f['before']
          source=zipfile.ZipFile(p);buff=io.BytesIO()
          with zipfile.ZipFile(buff,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for entry in f['entries']:
                  n=entry['name'];assert not n.startswith('/') and '..' not in n.split('/')
                  result=apply(source.read(n) if n in source.namelist() else b'',entry['ops']);assert digest(result)==entry['sha256']
                  info=zipfile.ZipInfo(n,date_time=(2026,10,26,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o600<<16
                  z.writestr(info,result,compresslevel=9)
          source.close();result=buff.getvalue();assert digest(result)==f['after'];p.write_bytes(result)
          manifest.append({'path':str(p),'sha256':f['after']})
          (out/'source-manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit, lint, existing UI contracts and workbook
        run: |
          set -euo pipefail
          node --test scripts/raceSessionControls.test.mjs scripts/kartCareerSave.test.mjs scripts/fighterRaceGameplayAudit.test.mjs scripts/fixedStepClock.test.mjs scripts/immersiveHubState.test.mjs | tee /tmp/race-delivery/unit.log
          npm run test:ui-immersion | tee /tmp/race-delivery/ui.log
          node node_modules/oxlint/bin/oxlint --max-warnings 0 src/components/RaceMode.jsx src/game/raceSessionControls.js scripts/raceSessionControls.test.mjs scripts/fixtures/raceLifecycleHarness.jsx scripts/fixedStepClock.test.mjs scripts/immersiveHubState.test.mjs | tee /tmp/race-delivery/lint.log
          python3 scripts/ui-immersion/verify-workbook.py docs/excel/Multiverse_Breach_UI_Immersion.xlsx | tee /tmp/race-delivery/workbook.json
      - name: Chromium with all seven committed race images
        run: |
          set -euo pipefail
          python3 -m venv /tmp/race-playwright
          /tmp/race-playwright/bin/pip install playwright==1.57.0
          /tmp/race-playwright/bin/python -m playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort > /tmp/race-delivery/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          /tmp/race-playwright/bin/python scripts/browserRaceImmersion.py --require-art --evidence /tmp/race-delivery/browser | tee /tmp/race-delivery/browser.log
      - name: Store verified blobs only, never move a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          manifest=json.loads(Path('/tmp/race-delivery/source-manifest.json').read_text());blobs=[]
          for f in manifest:
              raw=Path(f['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==f['sha256']
              data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/multiverse-breach/git/blobs',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'pr9-race-review','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as response:result=json.load(response)
              assert result['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              blobs.append({'path':f['path'],'mode':'100644','type':'blob','sha':result['sha']})
          Path('/tmp/race-delivery/verified-blobs.json').write_text(json.dumps(blobs,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: race-reviewed-${{ github.sha }}
          path: /tmp/race-delivery/
          retention-days: 14
