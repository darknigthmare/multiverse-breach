name: Tactics audit workbench
on:
  push:
    branches: [codex/audit-corrections-2026-10-16]
    paths: [.github/workflows/audit-tactics-workbench.yml]
permissions:
  contents: read
jobs:
  validate:
    if: github.repository == 'darknigthmare/multiverse-breach'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 2b66d67770d46a8c43cd5be3658a6b0908d6ad4c
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /supabase/
            /.github/
            **/*.json
            **/*.jsonl
            **/*.md
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Verify exact reviewed patch and its file scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/tactics-evidence
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo = 'darknigthmare/multiverse-breach'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == '2b66d67770d46a8c43cd5be3658a6b0908d6ad4c'
          def blob(sha):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: result=json.load(response)
              data=base64.b64decode(result['content'])
              assert hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()==sha
              return data
          chunks = ['45269a2ac76b2b12ee7d9ff9b403d21d6343c013','3b3082ddd24da534ec23daebc1152eaa2adbcbfb','1c75eb65d870feddcff5ed3de27fa151c7909fd7','e7d67aee0e259d6806e9b68968533c5ee5dfa4a9','71ee6bc3f73cf6c72baaed85814241130e0420fe']
          compressed=base64.b64decode(b''.join(map(blob,chunks)),validate=True)
          assert hashlib.sha256(compressed).hexdigest() == '829ac19150e3a8d98c1914ed37ab9deae9c2484b2178b3b346cd2d63cf9bd653'
          patch=lzma.decompress(compressed)
          assert len(patch) == 90786
          location=pathlib.Path('/tmp/tactics-evidence/reviewed.patch');location.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','--unidiff-zero',str(location)],check=True)
          subprocess.run(['git','apply','--index','--unidiff-zero',str(location)],check=True)
          allowed=['.github/workflows/audit-reliability.yml','docs/audits/tactics-reliability-2026-10-16.md','package.json','scripts/auditTacticsReliability.test.mjs','scripts/browserTacticsReliability.py','scripts/customBattle.test.mjs','scripts/fixtures/tactics-lifecycle.html','scripts/fixtures/tacticsLifecycleHarness.jsx','src/components/GameCanvas.jsx','src/components/TacticsSupportPanel.jsx','src/game/engineTactics.js','src/game/tacticsSupport.js']
          assert sorted(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()) == sorted(allowed)
          p=pathlib.Path('scripts/browserTacticsReliability.py');text=p.read_text()
          for label in ['HEAL','CLEANSE','REVIVE']:
              old=f"re.compile('QA {label}')";assert text.count(old)==1
              text=text.replace(old,f"re.compile('QA {label}', re.I)")
          p.write_text(text)
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'df05d3d4337c49a3e1b368ad80a0fbe64d3eaba8668a39fdd3a8080dba60647c'
          overlay=blob('48d61dea4ff1dacf1403f38945fa1a3cc7d36e97')
          assert hashlib.sha256(overlay).hexdigest()=='89cbfeec9deac7216cc0b14f7185f772ffc5e952539d7dd80184a6c087423ee7'
          location=pathlib.Path('/tmp/tactics-evidence/fixture-overlay.patch');location.write_bytes(overlay)
          subprocess.run(['git','apply','--check',str(location)],check=True)
          subprocess.run(['git','apply',str(location)],check=True)
          pathlib.Path('/tmp/tactics-evidence/allowed.json').write_text(json.dumps(allowed))
          print('Reviewed source patch and fixture correction verified; no branch writes.')
          PY
      - run: npm ci --no-audit --no-fund
      - name: New and existing regression suites
        run: |
          set -euo pipefail
          npm run sprites:availability:check
          npm run test:audit-tactics | tee /tmp/tactics-evidence/tactics.log
          npm run test:audit-reliability | tee /tmp/tactics-evidence/reliability.log
          npm run test:audit-followup | tee /tmp/tactics-evidence/followup.log
          npm run test:audit-combat | tee /tmp/tactics-evidence/combat.log
          npm run test:polish | tee /tmp/tactics-evidence/polish.log
          node --test --test-concurrency=1 scripts/combatEffectRegressions.test.mjs scripts/tacticsMissionObjectives.test.mjs scripts/customBattle.test.mjs scripts/canonRexAttackPatterns.test.mjs scripts/localSaveGuard.test.mjs scripts/cloudSaveConflictPolicy.test.mjs scripts/smashCanonAbilityProfiles.test.mjs scripts/smashObjectiveResolution.test.mjs scripts/canonEncounterExternalDamage.test.mjs scripts/rpgTargeting.test.mjs scripts/rpgTargetingPresentation.test.mjs scripts/canonRaamEncounter.test.mjs scripts/canonPiratesCurseEncounter.test.mjs scripts/canonPiratesPlayableJackCurse.test.mjs scripts/portalBoosterEngine.test.mjs scripts/portalBoosterEconomy.test.mjs | tee /tmp/tactics-evidence/existing-contracts.log
      - name: Lint changed files and compile sources
        run: |
          set -euo pipefail
          node node_modules/oxlint/bin/oxlint src/components/GameCanvas.jsx src/components/TacticsSupportPanel.jsx src/game/engineTactics.js src/game/tacticsSupport.js scripts/auditTacticsReliability.test.mjs scripts/customBattle.test.mjs scripts/fixtures/tacticsLifecycleHarness.jsx | tee /tmp/tactics-evidence/lint.log
          python3 -m py_compile scripts/browserTacticsReliability.py
          node node_modules/vite/bin/vite.js build | tee /tmp/tactics-evidence/source-build.log
      - name: Real Chromium Tactics and RPG controls on loopback only
        run: |
          set -euo pipefail
          python3 -m venv /tmp/tactics-playwright
          /tmp/tactics-playwright/bin/pip install playwright==1.57.0
          /tmp/tactics-playwright/bin/python -m playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort > /tmp/tactics-evidence/browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ > /dev/null && break; sleep 1; done
          /tmp/tactics-playwright/bin/python scripts/browserTacticsReliability.py --evidence /tmp/tactics-evidence/tactics-browser | tee /tmp/tactics-evidence/tactics-browser.log
          /tmp/tactics-playwright/bin/python scripts/browserRpgLifecycle.py --evidence /tmp/tactics-evidence/rpg-browser | tee /tmp/tactics-evidence/rpg-browser.log
      - name: Store verified source blobs without updating any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, urllib.request
          repo='darknigthmare/multiverse-breach'
          assert os.environ['GITHUB_REPOSITORY']==repo
          root=pathlib.Path('/tmp/tactics-evidence');allowed=json.loads((root/'allowed.json').read_text());result={}
          for name in allowed:
              data=pathlib.Path(name).read_bytes()
              body=json.dumps({'content':base64.b64encode(data).decode(),'encoding':'base64'}).encode()
              request=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs',data=body,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: sha=json.load(response)['sha']
              result[name]={'git':sha,'sha256':hashlib.sha256(data).hexdigest()}
          (root/'source-hashes.json').write_text(json.dumps(result,indent=2))
          print('Verified sources stored as blobs only; existing PR branch unchanged.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tactics-validation-evidence
          path: /tmp/tactics-evidence/
          retention-days: 7
