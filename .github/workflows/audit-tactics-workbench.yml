name: Tactical complementary validation
on:
  push:
    branches: [codex/audit-corrections-2026-10-16]
    paths: [.github/workflows/audit-tactics-workbench.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: eb9bb1756f06b63da0df0e87b2c46a683429197f
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /supabase/
            /.github/workflows/
            /public/sprites/generated/heroes/half-life/freeman.png
            /public/sprites/generated/heroes/portal/chell.png
            /public/sprites/generated/heroes/stargate/sam-carter.png
            /public/sprites/generated/heroes/halo/avery-johnson-complete/avery-johnson-universal.png
            /public/sprites/generated/heroes/star-wars/luke.png
            /public/sprites/generated/heroes/resident-evil/jill.png
            /public/sprites/generated/heroes/harry-potter/hermione.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-tactics.png
            **/*.json
            **/*.jsonl
            **/*.md
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Materialize exact reviewed complementary files only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,os,subprocess,urllib.request
          from pathlib import Path
          repo='darknigthmare/multiverse-breach'
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()=='eb9bb1756f06b63da0df0e87b2c46a683429197f'
          out=Path('/tmp/tactical-complement');out.mkdir()
          def blob(sha):
              request=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request,timeout=30) as response: raw=base64.b64decode(json.load(response)['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              return raw
          parts=['3f53b2252f93e06f1d68633f6b1537f8bbd2c59b','aedf1c43f7627a1306d77dee2689423985b11d44','1d835c80a5d0e212e9aa5c4b57ca49d9051c01d4','625665bff2baaac32409ccae2e19aa20194c3b6c']
          chunks=[blob(sha).decode('ascii') for sha in parts]
          chunks[-1]=chunks[-1].replace('Hz93cnxxcm3EPL','Hz93cnxxcm3yEPL')
          patch=gzip.decompress(base64.b64decode(''.join(chunks),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='ecce5d7098b249be7b8f6188313ee371411eec8578b69cd8077c217a759d14d4'
          file=out/'original-tests.patch';file.write_bytes(patch)
          new=['scripts/auditTacticsTurnSafety.test.mjs','scripts/browserTacticsTurns.py','scripts/fixtures/tacticsTurnHarness.jsx','scripts/fixtures/tactics-turns.html']
          includes=['--include='+p for p in new]
          subprocess.run(['git','apply','--check',*includes,str(file)],check=True)
          subprocess.run(['git','apply',*includes,str(file)],check=True)
          p=Path('src/game/engineTactics.js');s=p.read_text()
          def change(a,b):
              global s
              assert a in s,a[:120]
              s=s.replace(a,b,1)
          change("    if (!pickup || this.gameOver) return false;\n    const tier = pickup.tier", "    if (!pickup || this.disposed || this.paused || this.gameOver) return false;\n    const tier = pickup.tier")
          change("    if (this.actionPhase === 'move') {\n      const selectedCell = this.movementRange.find", "    if (this.actionPhase === 'move') {\n      // Terrain and occupancy can change after the range was first displayed.\n      this.calculateMovementRange();\n      const selectedCell = this.movementRange.find")
          change("if (!defender || !Number.isFinite(baseDmg) || baseDmg < 0 ||", "if (!defender || !Number.isFinite(baseDmg) || baseDmg <= 0 ||")
          change("if (this.applyEncounterDamage(defender, baseDmg, { kind: 'attack', attacker })) return;", "if (this.applyEncounterDamage(defender, baseDmg, { kind: 'attack', attacker })) return 0;")
          change("      if (wasAlive && defender.hp <= 0) this.updateTacticsObjective();\n      return;", "      if (wasAlive && defender.hp <= 0) this.updateTacticsObjective();\n      return hp - defender.hp;")
          change("      return;\n    }\n\n    const { cover: coverReduction, facing, terrain } = modifiers;", "      return hp - defender.hp;\n    }\n\n    const { cover: coverReduction, facing, terrain } = modifiers;")
          for status in ['null', "'glitched'"]:
              for indent in ['          ', '        ']:
                  old=f"{indent}this.applyDamage(itemAttacker, target, damage, {status}, {{ ignoreCover: true }});\n{indent}this.tacticalItemImpact += damage;"
                  if old in s: s=s.replace(old,f"{indent}this.tacticalItemImpact += this.applyDamage(itemAttacker, target, damage, {status}, {{ ignoreCover: true }});")
          method='''  getRexStingerDamage(attacker, variance = 1) {
              const encounter = this.rexEncounter;
              const body = encounter?.body;
              const weakpointHp = encounter?.phase === 'radome' ? encounter.radomeHp
                : encounter?.phase === 'cockpit' ? encounter.cockpitHp : 0;
              const base = this.getActionBaseDamage(attacker, 'rex_stinger');
              const cover = body ? this.getCoverReduction(attacker, body, 'rex_stinger') : 0;
              const defense = body ? Math.max(0, Math.min(0.3, getEffectiveCombatDefense(body, attacker) / 100)) : 0;
              const valid = body && Number.isFinite(weakpointHp) && weakpointHp > 0
                && Number.isFinite(base) && base > 0 && Number.isFinite(variance) && variance > 0;
              const raw = valid ? Math.max(0, Math.round(base * getCombatEventDamageMultiplier(attacker)
                * getTacticsSupportDamageMultiplier(attacker) * (1 - cover) * (1 - defense) * variance)) : 0;
              return { raw, cover, defense, damage: valid ? Math.min(weakpointHp, previewBattleItemDamage(body, raw)) : 0 };
            }

          '''
          change("  getDamagePreview(attacker, defender, actionType = 'simple') {",method+"  getDamagePreview(attacker, defender, actionType = 'simple') {")
          change("    const base = this.getActionBaseDamage(attacker, actionType);\n    const modifiers", "    if (this.rexEncounter && defender === this.rexEncounter.body && actionType === 'rex_stinger') {\n      const middle = this.getRexStingerDamage(attacker);\n      return { ...middle, min: this.getRexStingerDamage(attacker, 0.9).damage,\n        max: this.getRexStingerDamage(attacker, 1.1).damage };\n    }\n    const base = this.getActionBaseDamage(attacker, actionType);\n    const modifiers")
          change("    let damage = this.getActionBaseDamage(hero, 'rex_stinger') * getCombatEventDamageMultiplier(hero);\n    damage *= 1 - this.getCoverReduction(hero, body, 'rex_stinger');\n    damage *= 1 - Math.min(0.3, getEffectiveCombatDefense(body, hero) / 100);\n    damage = absorbBattleItemDamage(body, Math.round(damage * (0.9 + Math.random() * 0.2)));", "    const calculation = this.getRexStingerDamage(hero, 0.9 + Math.random() * 0.2);\n    const damage = absorbBattleItemDamage(body, calculation.raw);")
          p.write_text(s)
          p=Path(new[0]);s=p.read_text().replace('e.scheduleForTurn(', 'e.scheduleTurn(').replace('e.invalidateActiveTurn()', 'e.invalidateActorActions(e.activeUnit)')
          s=s.replace("test('AI can be stopped without a late attack ending the following turn',()=>{const e=createEngine(),target=e.enemies[0];e.runHeroAI();e.endActiveTurn();const hp=target.currentHp;steps(e,80);assert.equal(target.currentHp,hp);assert.equal(e.activeUnit,e.heroes[1]);});", "test('manual skip is rejected during AI resolution and the single action finishes normally',()=>{const e=createEngine(),target=e.enemies[0];e.runHeroAI();assert.equal(e.skipActiveTurn(),false);const hp=target.currentHp;steps(e,80);assert.ok(target.currentHp<hp);assert.equal(e.activeUnit,e.heroes[1]);const after=target.currentHp;steps(e,80);assert.equal(target.currentHp,after);});")
          p.write_text(s)
          p=Path('docs/audits/tactics-turn-safety-2026-10-16.md');p.write_bytes(blob('546a22daacc6b63887aa6bbe2a714d40914a41bf'))
          p=Path('package.json');data=json.loads(p.read_text());old=data['scripts']['test:audit-tactics'];assert old=='node --test scripts/auditTacticsReliability.test.mjs'
          data['scripts']['test:audit-tactics']=old+' scripts/auditTacticsTurnSafety.test.mjs';p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          p=Path('.github/workflows/audit-reliability.yml');s=p.read_text()
          assets=['half-life/freeman.png','portal/chell.png','stargate/sam-carter.png','halo/avery-johnson-complete/avery-johnson-universal.png','star-wars/luke.png','resident-evil/jill.png','harry-potter/hermione.png','nexus-de-convergence/arca-mirelle-complete/arca-mirelle-tactics.png']
          s=s.replace('            /supabase/\n','            /supabase/\n            /.github/workflows/\n'+''.join('            /public/sprites/generated/heroes/'+p+'\n' for p in assets))
          more='node --test --test-concurrency=1 scripts/auditCombatReliability.test.mjs scripts/tacticsMissionObjectives.test.mjs scripts/tacticalFighterFacing.test.mjs scripts/tacticsEscort.test.mjs scripts/customBattle.test.mjs scripts/canonRexAttackPatterns.test.mjs scripts/scarabEncounterMechanics.test.mjs scripts/canonRexEncounter.test.mjs scripts/canonEncounterExternalDamage.test.mjs scripts/canonBlackPearlSourceKits.test.mjs scripts/combatEffectRegressions.test.mjs'
          s=s.replace('      - name: Lint changed modules and tests','          '+more+' | tee /tmp/reliability-evidence/tactics-existing.log\n      - name: Lint changed modules and tests')
          s=s.replace('          node node_modules/oxlint/bin/oxlint\n','          node node_modules/oxlint/bin/oxlint\n          scripts/auditTacticsTurnSafety.test.mjs scripts/fixtures/tacticsTurnHarness.jsx\n')
          s=s.replace('      - uses: actions/upload-artifact@','          /tmp/multiverse-playwright/bin/python scripts/browserTacticsTurns.py --evidence /tmp/reliability-evidence/tactics-turns-browser | tee /tmp/reliability-evidence/tactics-turns-browser.log\n      - uses: actions/upload-artifact@')
          p.write_text(s)
          expected={'src/game/engineTactics.js':'10fa327db0b8c58c70144c46012fb17455f34c8b05242a80c3120e253084832f','scripts/auditTacticsTurnSafety.test.mjs':'8b635cece24bb4d2b118524f646ff8df269a925226686be37a80eb15f7ff8d4e','scripts/browserTacticsTurns.py':'1739651b13be71ef5b74c1b81a735fc7dbaeca1f7f9e918cb95adf4c1ef348d3','scripts/fixtures/tactics-turns.html':'e92a0b8f079f0e171988f9949041de7babe16b28879f0aad9100fee7bc973c27','scripts/fixtures/tacticsTurnHarness.jsx':'2048895f3326ec2e6fc9f733147c27401fa426a1305fd4683c6f57fb38835446','docs/audits/tactics-turn-safety-2026-10-16.md':'25c50c4d6b3bdaddf7cdf2dc51be4576f0bc8fff59300aeb2aa311fc932ef365','package.json':'5795d52e82e669a2b759da354f9d6232268391695f6abc0ee1cfd65c1c946024','.github/workflows/audit-reliability.yml':'ff397dcfe9198a6d6a7d0ca77bec21d44c4215e4ef1148323957dd9491fb1ccc'}
          for path,sha in expected.items(): assert hashlib.sha256(Path(path).read_bytes()).hexdigest()==sha,path
          (out/'expected.json').write_text(json.dumps(expected));print('Eight reviewed complementary files match local tested hashes; no ref updated.')
          PY
      - run: npm ci --no-audit --no-fund
      - name: Install isolated test tools
        run: |
          python3 -m venv /tmp/multiverse-playwright
          /tmp/multiverse-playwright/bin/pip install playwright==1.57.0 pyyaml==6.0.2
          /tmp/multiverse-playwright/bin/python -m playwright install --with-deps chromium
      - name: Execute all permanent checks including browser suites
        run: |
          /tmp/multiverse-playwright/bin/python - <<'PY'
          from pathlib import Path
          import subprocess,yaml
          steps=yaml.safe_load(Path('.github/workflows/audit-reliability.yml').read_text())['jobs']['reliability']['steps']
          names=['Derived index contract and reliability tests','Existing combat and save contracts','Lint changed modules and tests','Compile source snapshot (not full artwork publication)','Browser RPG, Tactics and authentication regressions (isolated fixtures)']
          for i,name in enumerate(names):
              command=next(s['run'] for s in steps if s.get('name')==name)
              if name.startswith('Browser'):
                  command='\n'.join(line for line in command.splitlines() if 'python3 -m venv' not in line and '/bin/pip install' not in line and 'playwright install' not in line)
              with Path(f'/tmp/tactical-complement/check-{i}.log').open('w') as f:
                  result=subprocess.run(['bash','-euo','pipefail','-c',command],stdout=f,stderr=subprocess.STDOUT)
              print(name,result.returncode,flush=True)
              if result.returncode: raise SystemExit(result.returncode)
          PY
      - name: Store exact tested source blobs without updating a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,json,os,urllib.request
          expected=json.loads(Path('/tmp/tactical-complement/expected.json').read_text());out=[]
          for path,sha256 in expected.items():
              raw=Path(path).read_bytes();assert hashlib.sha256(raw).hexdigest()==sha256
              sha=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              request=urllib.request.Request('https://api.github.com/repos/darknigthmare/multiverse-breach/git/blobs',data=json.dumps({'content':base64.b64encode(raw).decode(),'encoding':'base64'}).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(request,timeout=30) as response: assert json.load(response)['sha']==sha
              out.append({'path':path,'sha':sha,'sha256':sha256})
          Path('/tmp/tactical-complement/blob-map.json').write_text(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tactical-complement-${{ github.run_id }}
          path: |
            /tmp/tactical-complement/
            /tmp/reliability-evidence/
          retention-days: 7
