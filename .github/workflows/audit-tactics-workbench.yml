name: Tactical source reconciliation
on:
  push:
    branches: [codex/audit-corrections-2026-10-16]
    paths: [.github/workflows/audit-tactics-workbench.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /.github/workflows/
            /docs/audits/
            /public/sprites/generated/heroes/half-life/freeman.png
            /public/sprites/generated/heroes/portal/chell.png
            /public/sprites/generated/heroes/stargate/sam-carter.png
            /public/sprites/generated/heroes/halo/avery-johnson-complete/avery-johnson-universal.png
            /public/sprites/generated/heroes/star-wars/luke.png
            /public/sprites/generated/heroes/resident-evil/jill.png
            /public/sprites/generated/heroes/harry-potter/hermione.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-tactics.png
      - name: Archive reviewed source families only
        run: |
          mkdir -p /tmp/tactical-reconciliation
          git rev-parse HEAD > /tmp/tactical-reconciliation/commit.txt
          tar -czf /tmp/tactical-reconciliation/current-source.tgz src scripts .github/workflows docs/audits public/sprites/generated/heroes package.json package-lock.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tactical-current-source-${{ github.run_id }}
          path: /tmp/tactical-reconciliation/
          retention-days: 3
