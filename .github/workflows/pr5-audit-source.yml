name: PR5 audit source snapshot
on:
  push:
    branches: [codex/pr5-audit-snapshot-2026-10-20]
    paths: [.github/workflows/pr5-audit-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 964b355b99c8ddbab07e9a276061c4010eb9e144
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /supabase/
            /.github/workflows/
            /docs/audits/
            **/*.json
            **/*.jsonl
      - name: Archive allowlisted source without credentials or account state
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr5-audit-source
          git rev-parse HEAD > /tmp/pr5-audit-source/commit.txt
          git ls-tree -r HEAD > /tmp/pr5-audit-source/git-tree.txt
          tar -czf /tmp/pr5-audit-source/source.tgz src scripts api supabase .github/workflows docs/audits public package.json package-lock.json vite.config.js .oxlintrc.json index.html .nvmrc
          sha256sum /tmp/pr5-audit-source/source.tgz > /tmp/pr5-audit-source/source.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr5-source-964b355b
          path: /tmp/pr5-audit-source/
          retention-days: 3
