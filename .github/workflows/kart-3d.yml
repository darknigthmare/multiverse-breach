name: Kart 3D models and races
on:
  pull_request:
    paths:
      - 'src/game/kart/**'
      - 'src/game/engineRace.js'
      - 'src/components/RaceMode.jsx'
      - 'src/components/KartSpritePreview.jsx'
      - 'src/components/RaceKart3D.css'
      - 'scripts/kart/**'
      - 'scripts/kartModels.test.mjs'
      - 'public/kart/**'
      - 'DLC/**/assets/kart/**'
      - 'docs/kart/**'
      - '.github/workflows/kart-3d.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kart-3d-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  kart-3d:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /config/
            /DLC/
            !/DLC/*/assets/
            /DLC/*/assets/kart/
            /DLC/*/assets/**/*.json
            /docs/kart/
            **/*.json
            **/*.jsonl
            /public/kart/
            /public/sprites/generated/heroes/nexus-de-convergence/
            /DLC/Halo/assets/sprites/generated/heroes/halo/master-chief-complete/master-chief-universal.png
            /DLC/Alien/assets/sprites/generated/heroes/alien/ripley-v2-fidelity-wave12-2026-11-01.png
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Materialize included assets
        run: node scripts/prepareDlcAssets.mjs --available
      - name: Model, track, simulation and lifecycle contracts
        run: |
          set -euo pipefail
          mkdir -p /tmp/kart-3d-evidence
          git rev-parse HEAD > /tmp/kart-3d-evidence/tested-commit.txt
          node --test scripts/kartModels.test.mjs scripts/kart/*.test.mjs scripts/raceKeyboardInput.test.mjs scripts/raceSessionControls.test.mjs scripts/kartCareerSave.test.mjs scripts/fighterRaceGameplayAudit.test.mjs | tee /tmp/kart-3d-evidence/unit.log
          node scripts/kart/buildKartAssets.mjs --check | tee /tmp/kart-3d-evidence/assets.log
          node node_modules/oxlint/bin/oxlint --max-warnings 0 src/game/kart src/components/RaceMode.jsx src/components/KartSpritePreview.jsx scripts/kart | tee /tmp/kart-3d-evidence/lint.log
      - name: Native 3D renderer and complete assisted race
        run: |
          set -euo pipefail
          python3 -m venv /tmp/kart-playwright
          /tmp/kart-playwright/bin/pip install playwright==1.57.0
          /tmp/kart-playwright/bin/python -m playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort > /tmp/kart-3d-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          /tmp/kart-playwright/bin/python scripts/kart/browserKart3D.py --evidence /tmp/kart-3d-evidence/browser | tee /tmp/kart-3d-evidence/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: kart-3d-${{ github.sha }}
          path: /tmp/kart-3d-evidence/
          retention-days: 14
