name: Reaudit verified patch transfer
on:
  push:
    branches: [codex/reaudit-transfer-2026-10-19]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/reaudit-transfer-2026-10-19'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /supabase/
            /docs/audits/
            /.github/workflows/
            /audit/reaudit-transfer.patch.gz
      - name: Verify immutable patch and stage source only
        run: |
          set -euo pipefail
          mkdir -p /tmp/reaudit-transfer
          cp audit/reaudit-transfer.patch.gz /tmp/reaudit-transfer/transport.gz
          test "$(git rev-parse HEAD^)" = c4ea0b8867439bb1e01e2462fb6d36517d0b13f3
          python3 - <<'PY'
          import gzip, hashlib, pathlib, re, subprocess
          raw = pathlib.Path('audit/reaudit-transfer.patch.gz').read_bytes()
          assert hashlib.sha256(raw).hexdigest() == 'ccd61912dc38b73822494581b6358f1f89929d5813b4dc4f52cf930096ced3ed', 'Transport checksum mismatch; no source applied'
          patch = gzip.decompress(raw)
          assert hashlib.sha256(patch).hexdigest() == '43afcea64374bc93f4320b90d2e4058412f24eb119b175a9d494c5882af08638'
          path = pathlib.Path('/tmp/reaudit-transfer/verified.patch'); path.write_bytes(patch)
          args = ['git','apply','--index','--unidiff-zero','--exclude=.github/workflows/*']
          subprocess.run(args + ['--check',str(path)], check=True)
          subprocess.run(args + [str(path)], check=True)
          parts = patch.decode().split('diff --git ')[1:]
          assert len(parts) == 29
          for part in parts:
              name = part.splitlines()[0].split(' b/',1)[1]
              if name.startswith('.github/workflows/'): continue
              expected = re.search(r'^index [0-9a-f]+\.\.([0-9a-f]{40})',part,re.M).group(1)
              actual = subprocess.check_output(['git','rev-parse',':'+name],text=True).strip()
              assert actual == expected, name
          assert not subprocess.check_output(['git','diff','--cached','--name-only','--','.github/workflows/'],text=True).strip()
          PY
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'fix: materialize verified reaudit runtime corrections'
          git rev-parse HEAD > /tmp/reaudit-transfer/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/reaudit-transfer/source-tree.txt
          git ls-tree -r HEAD > /tmp/reaudit-transfer/git-tree.txt
      - name: Fast-forward only the temporary transfer branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          assert os.environ['GITHUB_REPOSITORY'] == 'darknigthmare/multiverse-breach'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/reaudit-transfer-2026-10-19'
          token = os.environ.pop('GH_TOKEN')
          env = dict(os.environ)
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode())
          subprocess.run(['git','push','origin','HEAD:refs/heads/codex/reaudit-transfer-2026-10-19'],env=env,check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reaudit-transfer-${{ github.run_id }}
          path: /tmp/reaudit-transfer/
          retention-days: 1
