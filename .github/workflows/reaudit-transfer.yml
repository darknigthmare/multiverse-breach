name: Reaudit render correction transfer
on:
  push:
    branches: [codex/reaudit-transfer-2026-10-19]
permissions:
  contents: read
jobs:
  transfer:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/reaudit-transfer-2026-10-19'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: src/components
      - name: Apply exact reviewed render fix
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = d3c0d75f4077273f703511758b1594cd30469b01
          python3 - <<'PY'
          import hashlib, pathlib
          p = pathlib.Path('src/components/GameCanvas.jsx')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '6c1db78ee849a1ba720aa604b3f49192c753093355f3ed35a1f79001b90a2859'
          old = "if (stage.mode !== 'RPG' && !matchInputLocked) {"
          new = "if (stage.mode !== 'RPG' && !(stage.mode === 'Smash' && engine.isMatchInputLocked?.())) {"
          s = p.read_text(); assert s.count(old) == 1
          p.write_text(s.replace(old, new))
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '8509e8a744a24f3be3c354af4704ee74361ef18a8d94c9db88082e0c1d7cb0a0'
          PY
          git add src/components/GameCanvas.jsx
          git diff --cached --check
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git commit -m 'fix(canvas): retain live match lock when drawing pickups'
      - name: Fast-forward only the temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, os, subprocess
          assert os.environ['GITHUB_REPOSITORY'] == 'darknigthmare/multiverse-breach'
          assert os.environ['GITHUB_REF'] == 'refs/heads/codex/reaudit-transfer-2026-10-19'
          token = os.environ.pop('GH_TOKEN'); env = dict(os.environ)
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0='AUTHORIZATION: basic '+base64.b64encode(('x-access-token:'+token).encode()).decode())
          subprocess.run(['git','push','origin','HEAD:refs/heads/codex/reaudit-transfer-2026-10-19'],env=env,check=True)
          PY
