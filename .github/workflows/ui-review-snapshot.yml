name: UI review snapshot
on:
  push:
    branches: [codex/immersive-ui-audit-2026-10-25]
permissions:
  contents: read
concurrency:
  group: ui-review-snapshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /.github/workflows/
            /docs/ui-immersion/
            /docs/excel/Multiverse_Breach_UI_Immersion.xlsx
            **/*.json
            **/*.jsonl
      - name: Package tracked review inputs (no credentials or installed dependencies)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess, zipfile
          out = Path('/tmp/ui-review'); out.mkdir(parents=True, exist_ok=True)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tracked = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with zipfile.ZipFile(out / 'source-review.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for name in tracked:
                  path = Path(name)
                  if not name or not path.is_file() or path.is_symlink():
                      continue
                  if path.suffix not in {'.js', '.jsx', '.mjs', '.cjs', '.ts', '.tsx', '.css', '.html', '.json', '.jsonl', '.md', '.py', '.sh', '.yml', '.yaml', '.xlsx', '.log'}:
                      continue
                  if name.startswith(('src/', 'scripts/', '.github/workflows/', 'docs/ui-immersion/', 'public/')) or name == 'docs/excel/Multiverse_Breach_UI_Immersion.xlsx' or '/' not in name:
                      archive.write(path, name)
              archive.writestr('REVIEW_COMMIT.txt', sha + '\n')
          (out / 'tested-source.txt').write_text(sha + '\nSource snapshot only; not a gameplay test result.\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ui-review-${{ github.sha }}
          path: /tmp/ui-review/
          retention-days: 7
