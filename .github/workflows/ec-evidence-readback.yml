name: EC verified evidence readback
on:
  push:
    branches: [codex/extinction-city-continuation-2026-10-27]
    paths: ['.github/workflows/ec-evidence-readback.yml']
permissions:
  contents: read
  actions: read
jobs:
  readback:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/extinction-city-continuation-2026-10-27'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the already verified artifact without modifying repository files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download 40525781811 --repo darknigthmare/multiverse-breach --name ec-workbooks-8cd6db25f59e70e36f18c8a46a69c0e49c45e338 --dir /tmp/ec-evidence
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/ec-evidence')
          for name in ('blobs.json','manifest.json','production-validation.json','ui-validation.json','catalog-summary.json','fixes-manifest.json'):
              path=root/name
              assert path.is_file() and path.stat().st_size<100000,name
              value=json.loads(path.read_text())
              print('\n--- BEGIN '+name+' ---')
              print(json.dumps(value,ensure_ascii=False,indent=2))
              print('--- END '+name+' ---')
          for name in ('units.log','catalog-tests.log'):
              lines=(root/name).read_text().splitlines()
              print('\n--- '+name+' tail ---\n'+'\n'.join(lines[-16:]))
          PY
