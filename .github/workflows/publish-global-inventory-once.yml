name: Publish verified global inventory workbook
on:
  push:
    branches:
      - codex/audit-fidelite-excels-2026-10-24
    paths:
      - docs/excel/evidence/global-inventory-package/**
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          filter: blob:none
          sparse-checkout: |
            docs/excel/evidence/global-inventory-package
      - name: Rehydrate the already authored and validated XLSX
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, json, lzma, zipfile
          from pathlib import Path
          from xml.etree import ElementTree as ET
          package = Path('docs/excel/evidence/global-inventory-package')
          packed = base64.b64decode(''.join((package / f'part-{i:02}.b64').read_text().strip() for i in range(4)), validate=True)
          assert hashlib.sha256(packed).hexdigest() == '340cca6fc0cc99a71f1c9daf5b339da9b0f48ef80c8d9f4e65954cde5821e57d', 'Package checksum mismatch'
          delta = base64.b64decode((package / 'delta.b64').read_text().strip(), validate=True)
          assert hashlib.sha256(delta).hexdigest() == '019fed74a06d0a11c9c9e68c11c78941d29dcdceac5448639467c0da6eaefcf8', 'Delta checksum mismatch'
          original = {entry['name']: entry for entry in json.loads(lzma.decompress(packed))}
          edits = json.loads(lzma.decompress(delta))['entries']
          assert len(original) == len(edits) == 26
          stream = io.BytesIO()
          with zipfile.ZipFile(stream, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for entry in edits:
                  content = original[entry['name']]['content']
                  assert hashlib.sha256(content.encode()).hexdigest() == entry['old_sha256']
                  for start, end, replacement in reversed(entry['edits']):
                      content = content[:start] + replacement + content[end:]
                  ET.fromstring(content)
                  info = zipfile.ZipInfo(entry['name'], tuple(entry['date_time']))
                  info.external_attr = entry['external_attr']
                  info.create_system = entry['create_system']
                  info.compress_type = zipfile.ZIP_DEFLATED
                  archive.writestr(info, content.encode(), compress_type=zipfile.ZIP_DEFLATED, compresslevel=9)
          data = stream.getvalue()
          expected = '55808050faa387e02097d2d2c3bf25b055b1306dca1d47161e1a1842bc57ea6d'
          assert len(data) == 68988 and hashlib.sha256(data).hexdigest() == expected, 'XLSX differs from the validated local deliverable'
          with zipfile.ZipFile(io.BytesIO(data)) as archive:
              assert archive.testzip() is None
              ns = {'x': 'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
              sheets = ET.fromstring(archive.read('xl/workbook.xml')).findall('x:sheets/x:sheet', ns)
              assert len(sheets) == 7
              formulas = sum(len(ET.fromstring(archive.read(f'xl/worksheets/sheet{i}.xml')).findall('.//x:f', ns)) for i in range(1, 8))
              assert formulas == 9
          target = Path('docs/excel/Multiverse_Breach_Etat_Global.xlsx')
          target.write_bytes(data)
          proof = {'filename': target.name, 'bytes': len(data), 'sha256': expected, 'git_blob_sha': '7ed77ade956c91247cf5e8dbfd2566b1160eb7ce', 'sheets': 7, 'formulas': formulas, 'zip_error': None, 'audited_pr_head': '55b1e0545ac1971deeeb2f83c719160805e3c7bb', 'method': 'Lossless rehydration of the artifact_tool-authored workbook; no data generation in CI.'}
          Path('docs/excel/evidence/global-inventory-xlsx-2026-10-25.json').write_text(json.dumps(proof, indent=2) + '\n')
          print(json.dumps(proof))
          PY
      - name: Commit only the verified workbook and its checksum
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/excel/Multiverse_Breach_Etat_Global.xlsx docs/excel/evidence/global-inventory-xlsx-2026-10-25.json
          git diff --cached --quiet && exit 0
          git commit -m 'docs: publish verified global game inventory workbook [skip ci]'
          git push origin HEAD:refs/heads/codex/audit-fidelite-excels-2026-10-24
