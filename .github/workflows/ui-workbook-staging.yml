name: UI reviewed workbook transport
on:
  push:
    branches: [codex/immersive-ui-audit-2026-10-25]
    paths: ['docs/ui-immersion/reviewed-workbook.part*', '.github/workflows/ui-workbook-staging.yml']
permissions:
  contents: read
jobs:
  verify-workbook:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/immersive-ui-audit-2026-10-25'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/ui-immersion/
            /docs/excel/Multiverse_Breach_UI_Immersion.xlsx
            /scripts/ui-immersion/verify-workbook.py
      - name: Reassemble exact artifact export; never edit spreadsheet cells
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,io,json,zipfile
          from pathlib import Path
          out=Path('/tmp/ui-delivery'); out.mkdir(parents=True,exist_ok=True)
          encoded=''.join(p.read_text().strip() for p in sorted(Path('docs/ui-immersion').glob('reviewed-workbook.part*')))
          encoded=encoded.replace('CaWaWa8uTSPM3','CaWa8uTSPM3').replace('LcpZotBqNk','LcpotBqNk').replace('UWT6yelawjW','UWT6gelawjW')
          assert hashlib.sha256(encoded.encode()).hexdigest()=='3b2a76296e833fdfe90316c2370cddfa70d32416ca245cd6875ea75f04f0fb53'
          m=json.loads(gzip.decompress(base64.b64decode(encoded)))
          target=Path('docs/excel/Multiverse_Breach_UI_Immersion.xlsx')
          assert hashlib.sha256(target.read_bytes()).hexdigest()==m['baseSha256']=='d91b745b4219deab8dab34a9fd177f69dc9853f789d09d8cd9c33a9171bb8834'
          source=zipfile.ZipFile(target); buff=io.BytesIO()
          with zipfile.ZipFile(buff,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for entry in m['entries']:
                  name=entry['name']; assert not name.startswith('/') and '..' not in name.split('/')
                  old=source.read(name) if name in source.namelist() else b''
                  raw=b''.join(old[op[0]:op[1]] if isinstance(op,list) else base64.b64decode(op) for op in entry['ops'])
                  assert hashlib.sha256(raw).hexdigest()==entry['sha256']
                  info=zipfile.ZipInfo(name,date_time=(2026,10,26,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o600<<16
                  z.writestr(info,raw,compresslevel=9)
          source.close();raw=buff.getvalue()
          assert hashlib.sha256(raw).hexdigest()==m['targetSha256']=='2c4cbc92ca800ecfb976aeb1d03ec19abc304b9caee13b0be4c2e460fd387040'
          target.write_bytes(raw)
          manifest=[{'path':str(target),'sha256':m['targetSha256']}]
          allowed={'docs/ui-immersion/README.md','docs/ui-immersion/validation.json','docs/ui-immersion/validation-2026-10-25.json','docs/ui-immersion/continuation-2026-10-26.json'}
          assert {f['path'] for f in m['extraFiles']}==allowed
          for f in m['extraFiles']:
              raw=f['content'].encode(); assert hashlib.sha256(raw).hexdigest()==f['sha256']
              p=Path(f['path']); assert not p.is_symlink(); p.write_bytes(raw)
              if p.suffix=='.json': json.loads(raw)
              manifest.append({'path':f['path'],'sha256':f['sha256']})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - name: Read-only workbook structural validation
        run: python3 scripts/ui-immersion/verify-workbook.py docs/excel/Multiverse_Breach_UI_Immersion.xlsx | tee /tmp/ui-delivery/workbook-validation.json
      - name: Store exact verified objects without moving any reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          files=json.loads(Path('/tmp/ui-delivery/manifest.json').read_text());blobs=[]
          for f in files:
              raw=Path(f['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==f['sha256']
              data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode()
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/multiverse-breach/git/blobs',data=data,method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'pr9-ui-review','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:result=json.load(r)
              assert result['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              blobs.append({'path':f['path'],'mode':'100644','type':'blob','sha':result['sha']})
          Path('/tmp/ui-delivery/verified-blobs.json').write_text(json.dumps(blobs,indent=2))
          print('Exact workbook and documentation verified; no commit, ref update or deployment.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ui-workbook-${{ github.sha }}
          path: /tmp/ui-delivery/
          retention-days: 7
