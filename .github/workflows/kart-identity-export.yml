name: Materialize universe vehicle identities
on:
  push:
    branches: [kart-identity-export-2026-11-09]
    paths: [.github/workflows/kart-identity-export.yml]
permissions:
  contents: write
jobs:
  export:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/kart-identity-export-2026-11-09'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 3
          persist-credentials: true
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /.github/workflows/
            /src/
            /scripts/
            /config/
            /DLC/
            !/DLC/*/assets/
            /DLC/*/assets/kart/
            /DLC/*/assets/**/*.json
            /docs/kart/
            **/*.json
            **/*.jsonl
            /public/kart/
            /public/sprites/generated/heroes/nexus-de-convergence/
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Rebuild and verify every model and sprite atlas
        run: |
          set -euo pipefail
          node scripts/kart/buildKartAssets.mjs --all
          node scripts/kart/buildKartAssets.mjs --check
          npm run test:kart
          git add --sparse -- DLC public/kart docs/kart/kart-assets.json docs/kart/kart-identity-review.json docs/kart/kart-identities-before-after.png docs/kart/kart-identities-gallery.png
          node scripts/buildDlcAssetManifests.mjs --write
          git add --sparse -- DLC .gitignore .vercelignore
          git rm .github/workflows/kart-identity-export.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(kart): regenerate universe vehicles and matching directional sprites'
          git push origin HEAD:refs/heads/kart-identity-export-2026-11-09
