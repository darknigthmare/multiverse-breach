name: Prepare Fighter hit-stop regression checks
on:
  push:
    branches: [codex/reaudit-fighter-checks-ba32203c]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/workflows/
      - name: Apply exact tested patch without running repository scripts
        run: |
          set -euo pipefail
          mkdir -p /tmp/fighter-checks
          printf '%s' '' | base64 -d | gzip -d > /tmp/fighter-checks/change.patch
          echo '22030d67db1973378d757a23009f5b7c1a3796cd230d3bfebef6e72d13eea02c  /tmp/fighter-checks/change.patch' | sha256sum -c -
          git switch --detach ba32203c210e435e0247b89693e6025b6b2c0f5c
          git apply --check /tmp/fighter-checks/change.patch
          git apply --index /tmp/fighter-checks/change.patch
          git diff --cached --check
          test -z "$(git diff --cached --name-only -- .github/workflows)"
          tree=$(git write-tree)
          commit=$(git -c user.name='Multiverse maintenance' -c user.email='noreply@github.com' commit-tree "$tree" -p ba32203c210e435e0247b89693e6025b6b2c0f5c -m 'test(fighter): respect shared hit-stop before independent P2 assist')
          printf '%s\n' "$commit" > /tmp/fighter-checks/commit.txt
          printf '%s\n' "$tree" > /tmp/fighter-checks/tree.txt
          sha256sum scripts/customBattle.test.mjs scripts/reauditFighterLifecycle.test.mjs > /tmp/fighter-checks/source.sha256
      - name: Publish isolated prepared code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = darknigthmare/multiverse-breach
          gh auth setup-git
          commit=$(cat /tmp/fighter-checks/commit.txt)
          git push origin "$commit:refs/heads/codex/reaudit-fighter-checks-prepared-ba32203c"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fighter-checks
          path: /tmp/fighter-checks/
          retention-days: 3
