name: Race immersive UI
on:
  pull_request:
    paths:
      - 'src/components/RaceMode.jsx'
      - 'src/components/HubImmersion.css'
      - 'src/game/engineRace.js'
      - 'src/game/scenePresentation.js'
      - 'src/game/raceSessionControls.js'
      - 'scripts/**'
      - '.github/workflows/race-ui.yml'
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: race-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  race-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            **/*.json
            **/*.jsonl
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-directions.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-actions.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-items.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-hud-icons.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-hud-avatar.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-hud-garage.png
            /public/sprites/generated/heroes/nexus-de-convergence/arca-mirelle-complete/arca-mirelle-kart-track-nexus.png
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit contracts and lint
        run: |
          set -euo pipefail
          mkdir -p /tmp/race-ui-evidence
          git rev-parse HEAD > /tmp/race-ui-evidence/tested-commit.txt
          node --test scripts/raceSessionControls.test.mjs scripts/kartCareerSave.test.mjs scripts/fighterRaceGameplayAudit.test.mjs scripts/fixedStepClock.test.mjs scripts/immersiveHubState.test.mjs scripts/scenePresentation.test.mjs | tee /tmp/race-ui-evidence/unit.log
          node node_modules/oxlint/bin/oxlint --max-warnings 0 src/components/RaceMode.jsx src/game/raceSessionControls.js scripts/raceSessionControls.test.mjs scripts/fixtures/raceLifecycleHarness.jsx scripts/fixedStepClock.test.mjs scripts/immersiveHubState.test.mjs | tee /tmp/race-ui-evidence/lint.log
      - name: Chromium lifecycle and committed artwork
        run: |
          set -euo pipefail
          python3 -m venv /tmp/race-playwright
          /tmp/race-playwright/bin/pip install playwright==1.57.0
          /tmp/race-playwright/bin/python -m playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort > /tmp/race-ui-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 30); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          /tmp/race-playwright/bin/python scripts/browserRaceImmersion.py --require-art --evidence /tmp/race-ui-evidence/browser | tee /tmp/race-ui-evidence/browser.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: race-ui-${{ github.sha }}
          path: /tmp/race-ui-evidence/
          retention-days: 14
