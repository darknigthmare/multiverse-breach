name: PR4 healing AI verified blobs
on:
  push:
    branches: [codex/pr4-source-check-2026-10-19-0940]
    paths: [.github/workflows/pr4-healing-ai-blobs.yml]
permissions:
  contents: write
jobs:
  blobs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 02707a97ea0e5f5a208ef3824d4db223b1a7039d
          path: transfer
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: /.audit-transfer/healing-ai.patch
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: d3043e949d0cd81526868e2c9c83504f513fa0d0
          path: source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/
            /scripts/
            /docs/audits/
      - name: Verify and apply reviewed patch
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,hashlib
          root=pathlib.Path('source').resolve();patch=pathlib.Path('transfer/.audit-transfer/healing-ai.patch').resolve()
          assert hashlib.sha256(patch.read_bytes()).hexdigest()=='e6d76b3e0f0f9f2e5a4a2808ff7a00a64f3b349d3259fa3febeeaae63b405b47'
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()=='d3043e949d0cd81526868e2c9c83504f513fa0d0'
          subprocess.run(['git','apply','--check','--index',str(patch)],cwd=root,check=True)
          subprocess.run(['git','apply','--index',str(patch)],cwd=root,check=True)
          expected={'docs/audits/pr4-fighter-healing-release-2026-10-19.md':'0158168bd11eee19794256b6998759116d2c08fa8f434f0fcd6e0c0d137dd1c2','scripts/reauditFighterHealing.test.mjs':'6b3915f776371a847f695c7d1a64886cbd005a2b1faf9d1c20b754bc284ff8e6','src/game/engineFighter.js':'86f3dce3ea218ac6f73caef5fd118e144e39b283faefdcd6ca8922dad12f3489','src/game/fighterHealing.js':'8f0bf9d240adc06e7ff6544810055dfc56480da316b90a833772744e3bea839b'}
          assert set(subprocess.check_output(['git','diff','--cached','--name-only'],cwd=root,text=True).splitlines())==set(expected)
          for path,digest in expected.items():assert hashlib.sha256((root/path).read_bytes()).hexdigest()==digest,path
          pathlib.Path('/tmp/healing-ai').mkdir()
          pathlib.Path('/tmp/healing-ai/hashes.json').write_text(json.dumps(expected,indent=2))
          pathlib.Path('/tmp/healing-ai-payload.json').write_text(json.dumps([{'path':p,'content':(root/p).read_text()} for p in expected]))
          PY
      - name: Store exact blobs, no tree or branch writes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import pathlib,subprocess,json,hashlib
          result=[]
          for e in json.loads(pathlib.Path('/tmp/healing-ai-payload.json').read_text()):
            data=e['content'].encode();expected=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
            raw=subprocess.check_output(['gh','api','--method','POST','repos/darknigthmare/multiverse-breach/git/blobs','--input','-'],input=json.dumps({'content':e['content'],'encoding':'utf-8'}),text=True)
            sha=json.loads(raw)['sha'];assert sha==expected
            result.append({'path':e['path'],'mode':'100644','type':'blob','sha':sha})
          pathlib.Path('/tmp/healing-ai/blobs.json').write_text(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr4-healing-ai-blobs
          path: /tmp/healing-ai/
          retention-days: 3
