name: EC verified workbook delivery
on:
  push:
    branches: [codex/extinction-city-continuation-2026-10-27]
    paths: ['docs/extinction-city/workbook-delivery.part*', '.github/workflows/ec-workbook-delivery.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/extinction-city-continuation-2026-10-27'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /docs/extinction-city/
            /docs/excel/Multiverse_Breach_Extinction_Cite_Production.xlsx
            /docs/excel/Multiverse_Breach_UI_Immersion.xlsx
            **/*.json
            **/*.jsonl
      - name: Reconstruct exact exported bytes, never author spreadsheet cells
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,io,json,zipfile
          from pathlib import Path
          out=Path('/tmp/ec-workbooks');out.mkdir(exist_ok=True)
          parts=sorted(Path('docs/extinction-city').glob('workbook-delivery.part*'))
          assert len(parts)==6
          encoded=''.join(p.read_text().strip() for p in parts)
          assert hashlib.sha256(encoded.encode()).hexdigest()=='b737ac595e2a0d57c4f721a6b1bb3f7aa48d6c9c7d544e084c8b0a42394eec84'
          decoded=gzip.decompress(base64.b64decode(encoded,validate=True));assert len(decoded)<1000000
          m=json.loads(decoded)
          allowed={'docs/excel/Multiverse_Breach_Extinction_Cite_Production.xlsx','docs/excel/Multiverse_Breach_UI_Immersion.xlsx','scripts/extinction-city/catalog.mjs','scripts/extinction-city/build_workbook.py','docs/extinction-city/workbook-followup-2026-10-27.json'}
          assert len(m['files'])==5 and {f['path'] for f in m['files']}==allowed
          def h(raw):return hashlib.sha256(raw).hexdigest()
          def reconstruct(old,ops):
              result=[]
              for op in ops:
                  if isinstance(op,list):
                      assert len(op)==2 and all(type(i)==int for i in op) and 0<=op[0]<=op[1]<=len(old)
                      result.append(old[op[0]:op[1]])
                  else:result.append(base64.b64decode(op,validate=True))
              return b''.join(result)
          manifest=[]
          for f in m['files']:
              p=Path(f['path']);assert not p.is_symlink()
              old=p.read_bytes() if p.exists() else b''
              assert (h(old) if p.exists() else None)==f['before'],('base mismatch',str(p))
              if f['kind']=='raw':raw=reconstruct(old,f['ops'])
              else:
                  assert f['kind']=='zip'
                  buff=io.BytesIO()
                  with zipfile.ZipFile(io.BytesIO(old)) as source,zipfile.ZipFile(buff,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as target:
                      names=set()
                      for entry in f['entries']:
                          name=entry['name'];assert name not in names and not name.startswith('/') and '..' not in name.split('/')
                          names.add(name)
                          before=source.read(name) if name in source.namelist() else b''
                          for a,b in entry.get('replacements',[]):before=before.replace(base64.b64decode(a,validate=True),base64.b64decode(b,validate=True))
                          data=reconstruct(before,entry['ops']);assert h(data)==entry['sha256'],name
                          info=zipfile.ZipInfo(name,(2026,10,27,0,0,0));info.compress_type=zipfile.ZIP_DEFLATED;info.external_attr=0o600<<16
                          target.writestr(info,data,compresslevel=9)
                  raw=buff.getvalue()
              assert h(raw)==f['after'],('target mismatch',str(p))
              p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(raw)
              manifest.append({'path':str(p),'sha256':h(raw)})
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Resolve catalogue and compare exported cells read-only
        run: |
          set -euo pipefail
          node --no-warnings --loader ./scripts/sourceSceneTestLoader.mjs --test scripts/extinctionCityCatalog.test.mjs | tee /tmp/ec-workbooks/catalog-tests.log
          node --no-warnings --loader ./scripts/sourceSceneTestLoader.mjs scripts/extinction-city/catalog.mjs dc95aec15309fb2f9a23e36971b30db46197f9a6 /tmp/ec-workbooks/catalog.json | tee /tmp/ec-workbooks/catalog-summary.json
          python3 scripts/extinction-city/verify_workbook.py /tmp/ec-workbooks/catalog.json docs/excel/Multiverse_Breach_Extinction_Cite_Production.xlsx | tee /tmp/ec-workbooks/production-validation.json
          python3 scripts/ui-immersion/verify-workbook.py docs/excel/Multiverse_Breach_UI_Immersion.xlsx --report /tmp/ec-workbooks/ui-validation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/ec-workbooks/production-validation.json').read_text())
          assert report['catalogRows']==17732 and report['verifiedCells']==210518 and report['cachedFormulaErrors']==0
          assert report['catalogSha256']=='8f81d4806e8cc3d2cbc54e8e0026c32ab28d3fad63a29ecf3dce874ec961dddb'
          Path('/tmp/ec-workbooks/catalog.json').unlink()
          PY
      - name: Store verified Git blobs only, no commit or ref update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          files=json.loads(Path('/tmp/ec-workbooks/manifest.json').read_text());blobs=[]
          for f in files:
              raw=Path(f['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==f['sha256']
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/multiverse-breach/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ec-workbook-review'})
              with urllib.request.urlopen(req,timeout=30) as r:result=json.load(r)
              assert result['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              blobs.append({'path':f['path'],'mode':'100644','type':'blob','sha':result['sha']})
          Path('/tmp/ec-workbooks/blobs.json').write_text(json.dumps(blobs,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ec-workbooks-${{ github.sha }}
          path: /tmp/ec-workbooks/
          retention-days: 14
