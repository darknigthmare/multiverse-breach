name: EC verified workbook delivery
on:
  push:
    branches: [codex/extinction-city-continuation-2026-10-27]
    paths: ['docs/extinction-city/workbook-delivery*', 'docs/extinction-city/apply-workbook-transport.py', '.github/workflows/ec-workbook-delivery.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/extinction-city-continuation-2026-10-27'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /docs/extinction-city/
            /docs/excel/Multiverse_Breach_Extinction_Cite_Production.xlsx
            /docs/excel/Multiverse_Breach_UI_Immersion.xlsx
            **/*.json
            **/*.jsonl
      - name: Reconstruct exact exported bytes and verified source fixes
        run: python3 docs/extinction-city/apply-workbook-transport.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Executable contracts and read-only workbook checks
        run: |
          set -euo pipefail
          node --test scripts/sceneInputs.test.mjs scripts/extinctionTiming.test.mjs scripts/mosaicCityRuntime.test.mjs scripts/immersiveHubState.test.mjs scripts/extinctionContent.test.mjs scripts/mosaicUniversePlaces.test.mjs scripts/scenePresentation.test.mjs scripts/mosaicResidents.test.mjs scripts/mosaicResidentNavigation.test.mjs scripts/extinctionViewmodelContract.test.mjs | tee /tmp/ec-workbooks/units.log
          node --no-warnings --loader ./scripts/sourceSceneTestLoader.mjs --test scripts/extinctionCityCatalog.test.mjs | tee /tmp/ec-workbooks/catalog-tests.log
          node --no-warnings --loader ./scripts/sourceSceneTestLoader.mjs scripts/extinction-city/catalog.mjs dc95aec15309fb2f9a23e36971b30db46197f9a6 /tmp/ec-workbooks/catalog.json | tee /tmp/ec-workbooks/catalog-summary.json
          python3 scripts/extinction-city/verify_workbook.py /tmp/ec-workbooks/catalog.json docs/excel/Multiverse_Breach_Extinction_Cite_Production.xlsx | tee /tmp/ec-workbooks/production-validation.json
          python3 scripts/ui-immersion/verify-workbook.py docs/excel/Multiverse_Breach_UI_Immersion.xlsx --report /tmp/ec-workbooks/ui-validation.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('/tmp/ec-workbooks/production-validation.json').read_text())
          assert report['catalogRows']==17732 and report['verifiedCells']==210518 and report['cachedFormulaErrors']==0
          assert report['catalogSha256']=='8f81d4806e8cc3d2cbc54e8e0026c32ab28d3fad63a29ecf3dce874ec961dddb'
          Path('/tmp/ec-workbooks/catalog.json').unlink()
          PY
      - name: Store verified Git blobs only, no commit or ref update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          files=json.loads(Path('/tmp/ec-workbooks/manifest.json').read_text());blobs=[]
          for f in files:
              raw=Path(f['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==f['sha256']
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/multiverse-breach/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'ec-workbook-review'})
              with urllib.request.urlopen(req,timeout=30) as r:result=json.load(r)
              assert result['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              blobs.append({'path':f['path'],'mode':'100644','type':'blob','sha':result['sha']})
          Path('/tmp/ec-workbooks/blobs.json').write_text(json.dumps(blobs,indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ec-workbooks-${{ github.sha }}
          path: /tmp/ec-workbooks/
          retention-days: 14
