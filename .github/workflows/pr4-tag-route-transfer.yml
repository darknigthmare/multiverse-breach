name: PR4 tag route verified transfer
on:
  push:
    branches: [codex/pr4-tag-route-transfer-1e7]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /.github/
            /docs/audits/
      - name: Apply only the reviewed three-file delta on the exact parent
        shell: bash
        run: |
          set -euo pipefail
          cp .github/pr4-transfer/reauditFighterTagRoutes.test.mjs /tmp/reauditFighterTagRoutes.test.mjs
          git checkout --detach 1e7cf3bd497a8bae9c6a304761ed443dd189193e
          python3 - <<'PY'
          import hashlib, json, pathlib, subprocess
          base = '1e7cf3bd497a8bae9c6a304761ed443dd189193e'
          expected = {
            'scripts/reauditFighterTagRoutes.test.mjs': '45e0bab0ccc1e259631c8f6293d74b7d1f73c9b80423a0c71aa1766305bfbae9',
            'scripts/progressionAudit.mjs': '8f9de8b0466088648cc7bdbff43aeae57a4c8b740341697ff192d5d9c023da0a',
            'docs/audits/pr4-fighter-controls-2026-10-19.md': '1c5105972e20feb41b9112fa9219e31543e9eb1201cb07d1c47ebcd6103a69f5'
          }
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == base
          old = '''assert(fighterModeSource.includes("triggerPlayerAction('tag'") && fighterModeSource.includes("['1', '2', '3']"), 'Fighter screen must expose manual three-slot tag controls.');'''
          new = '''// Verify all three slots through the real screen callbacks and engine for both
          // players. The choice of a P1 alias or shared side dispatcher is not gameplay.
          const fighterTagAudit = spawnSync(process.execPath,
            ['--test', fileURLToPath(new URL('./reauditFighterTagRoutes.test.mjs', import.meta.url))],
            { cwd: fileURLToPath(new URL('../', import.meta.url)), stdio: 'inherit', timeout: 60_000 });
          assert(!fighterTagAudit.error && fighterTagAudit.status === 0,
            'Fighter runtime keyboard/button three-slot replacement regression failed.');'''
          p = pathlib.Path('scripts/progressionAudit.mjs')
          source = p.read_text()
          assert source.count(old) == 1
          p.write_text(source.replace(old, new))
          pathlib.Path('scripts/reauditFighterTagRoutes.test.mjs').write_bytes(pathlib.Path('/tmp/reauditFighterTagRoutes.test.mjs').read_bytes())
          addition = '''
          ## Dernier contrôle périmé du prébuild

          Après les six recettes Fighter réussies, le build intégral de `1e7cf3bd` a atteint
          `check:progression`, puis échoué sur un second contrôle textuel : il exigeait
          l'ancien alias `triggerPlayerAction('tag')`. La commande utilise désormais le
          répartiteur partagé des deux camps. Le contrôle est remplacé par 16 tests qui
          exécutent les vrais callbacks clavier et bouton extraits de FighterMode avec
          le vrai moteur : les trois emplacements, P1/P2, pause, onglet masqué et gel
          d'impact. Aucune commande du jeu n'a été rendue plus permissive. Les autres
          contrôles de progression et d'assets restent conservés.

          Ces tests sont présents dans le groupe rapide (158 tests au total) et sont aussi
          appelés par le prébuild. Le résultat final doit être relu sur la nouvelle tête.
          '''
          p = pathlib.Path('docs/audits/pr4-fighter-controls-2026-10-19.md')
          p.write_text(p.read_text() + addition)
          for name, digest in expected.items():
              assert hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() == digest, name
          subprocess.run(['git', 'add', '--', *expected], check=True)
          assert set(git('diff', '--cached', '--name-only').splitlines()) == set(expected)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = git('write-tree')
          commit = git('-c', 'user.name=Multiverse maintenance', '-c', 'user.email=noreply@github.com', 'commit-tree', tree, '-p', base, '-m', 'test(build): verify real Fighter tag routes instead of a removed P1 alias')
          assert git('rev-parse', commit + '^') == base
          output = pathlib.Path('/tmp/pr4-route-verified')
          output.mkdir()
          (output / 'candidate.json').write_text(json.dumps({'parent': base, 'commit': commit, 'tree': tree, 'files': expected}, indent=2) + '\n')
          (output / 'candidate-sha.txt').write_text(commit + '\n')
          print(json.dumps({'verifiedFiles': len(expected), 'commit': commit, 'tree': tree}))
          PY
      - name: Publish the verified candidate on a temporary result branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr4-route-askpass <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' x-access-token ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 /tmp/pr4-route-askpass
          trap 'rm -f /tmp/pr4-route-askpass' EXIT
          export GIT_ASKPASS=/tmp/pr4-route-askpass GIT_TERMINAL_PROMPT=0
          candidate=$(cat /tmp/pr4-route-verified/candidate-sha.txt)
          git -c credential.helper= push origin "$candidate:refs/heads/codex/pr4-tag-routes-verified-1e7"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pr4-tag-routes-verified
          path: /tmp/pr4-route-verified/
          retention-days: 3
