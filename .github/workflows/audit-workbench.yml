name: Audit workbench
on:
  push:
    branches: [codex/audit-corrections-2026-10-16]
    paths: [.github/workflows/audit-workbench.yml]
permissions:
  contents: read
jobs:
  deliver-reviewed-patch:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/audit-corrections-2026-10-16'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /supabase/
            **/*.json
            **/*.jsonl
            **/*.md
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Retrieve reviewed patch and verify exact checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          : > /tmp/reliability.br
          for sha in 7c37ceb035e3cf742c741dfd3b4bf651f9c0ae4d 234fd621c2b57820d3465f9fdd0321b419af2dcf 78186510fa4cb28c49824770dd609b32cb5ab543 8edcb0277e8ee5f11687dbca4b6fbf3fd0f43194; do
            gh api "repos/darknigthmare/multiverse-breach/git/blobs/$sha" --jq .content | base64 --decode >> /tmp/reliability.br
          done
          echo '54e7747856f69fbcf2e8b27ae6a2610de1cad083dad7606a24f4592b5b68eace  /tmp/reliability.br' | sha256sum --check
          node --input-type=commonjs -e "const fs=require('node:fs');fs.writeFileSync('/tmp/reliability.patch',require('node:zlib').brotliDecompressSync(fs.readFileSync('/tmp/reliability.br')))"
          echo '9d353dc8949448f59947d6705bce619b81f9f86e6e7128a0820d5ccee534cd8c  /tmp/reliability.patch' | sha256sum --check
          git apply --unidiff-zero --check /tmp/reliability.patch
          git apply --unidiff-zero /tmp/reliability.patch
          node scripts/buildSpriteAvailability.mjs
          git diff --check
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Reliability regressions and index contract
        run: |
          set -euo pipefail
          npm run sprites:availability:check
          npm run test:audit-reliability | tee /tmp/audit-reliability.log
      - name: Existing combat regressions
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 scripts/combatEffectRegressions.test.mjs scripts/tacticsMissionObjectives.test.mjs scripts/customBattle.test.mjs scripts/canonRexAttackPatterns.test.mjs | tee /tmp/audit-combat.log
      - name: Compile source snapshot
        run: |
          set -euo pipefail
          node node_modules/vite/bin/vite.js build | tee /tmp/audit-build.log
      - name: Commit explicit reviewed source paths only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = codex/audit-corrections-2026-10-16
          git add --sparse docs/audits/reliability-corrections-2026-10-16.md package.json scripts/auditApplicationIntegration.test.mjs scripts/auditCloudReliability.test.mjs scripts/auditCombatReliability.test.mjs scripts/auditSaveCalendar.test.mjs scripts/auditSpriteAvailability.test.mjs scripts/buildSpriteAvailability.mjs scripts/canonRexAttackPatterns.test.mjs scripts/cloudReconciliationRace.test.mjs scripts/combatEffectRegressions.test.mjs scripts/customBattle.test.mjs src/App.jsx src/components/AuthPanel.jsx src/components/GameCanvas.jsx src/components/HubScreen.jsx src/game/cloudOperationEpoch.js src/game/cloudSave.js src/game/cloudTransport.js src/game/engineTactics.js src/game/localSaveGuard.js src/game/progressCalendar.js src/game/safeStorage.js src/game/saveRecovery.js src/game/saveValidation.js public/sprites/generated/sprite-availability.json
          test "$(git diff --cached --name-only | wc -l)" -eq 26
          git diff --cached --name-only | grep -E '\.(js|jsx|mjs)$' | xargs node node_modules/oxlint/bin/oxlint
          git diff --cached --name-only -z | xargs -0 sha256sum > /tmp/audit-delivery-hashes.txt
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: harden saves, cloud sessions, calendar and tactical combat; reduce hub payload'
          gh auth setup-git
          git push origin HEAD:refs/heads/codex/audit-corrections-2026-10-16
          git rev-parse HEAD > /tmp/audit-delivery-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reliability-delivery-evidence
          path: |
            /tmp/audit-reliability.log
            /tmp/audit-combat.log
            /tmp/audit-build.log
            /tmp/audit-delivery-hashes.txt
            /tmp/audit-delivery-commit.txt
          retention-days: 7
