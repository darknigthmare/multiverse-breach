name: Audit workbench
on:
  push:
    branches: [codex/audit-corrections-2026-10-16]
    paths: [.github/workflows/audit-workbench.yml, scripts/applyAuditReliabilityFixes.mjs]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /supabase/
            **/*.json
            **/*.jsonl
            **/*.md
      - name: Install exact lockfile dependencies
        run: |
          node --version
          npm ci --no-audit --no-fund
          tar -czf /tmp/audit-node-modules.tgz node_modules
      - name: Baseline save regression tests
        run: node --test scripts/localSaveGuard.test.mjs scripts/cloudSaveConflictPolicy.test.mjs scripts/cloudReconciliationRace.test.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: audit-locked-node-modules
          path: /tmp/audit-node-modules.tgz
          retention-days: 3
