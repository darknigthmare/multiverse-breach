name: City and Extinction reviewed delivery
on:
  push:
    branches: [codex/immersive-ui-audit-2026-10-25]
    paths: ['docs/ui-immersion/scene-reviewed.part*', '.github/workflows/scene-reviewed-delivery.yml']
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'darknigthmare/multiverse-breach' && github.ref == 'refs/heads/codex/immersive-ui-audit-2026-10-25'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /src/
            /scripts/
            /api/
            /.github/workflows/
            /docs/ui-immersion/
            /docs/excel/Multiverse_Breach_UI_Immersion.xlsx
            **/*.json
            **/*.jsonl
            /public/images/campaign-oc/chapter-01-atrium-v1.png
            /public/sprites/generated/heroes/nexus-de-convergence/
            /public/backgrounds/lore-stages/nexus-de-convergence/rpg.webp
      - name: Verify and apply exact reviewed source
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,json,subprocess
          from pathlib import Path
          out=Path('/tmp/scene-ui-evidence');out.mkdir(parents=True)
          parts=sorted(Path('docs/ui-immersion').glob('scene-reviewed.part*'));assert len(parts)==16
          encoded=''.join(p.read_text().strip() for p in parts)
          assert hashlib.sha256(encoded.encode()).hexdigest()=='2a5e223e07c3a079b0b32b437029aadcd84d649d9ec2907653725546fb6d9b66'
          payload=json.loads(gzip.decompress(base64.b64decode(encoded)));m=payload['manifest']
          allowed={'src/components/HubScreen.jsx','src/components/HubImmersion.css','src/components/SceneHoldButton.jsx','src/game/sceneInputs.js','scripts/immersiveHubState.test.mjs','scripts/mosaicCityRuntime.test.mjs','scripts/sceneInputs.test.mjs','scripts/browserCityExtinction.py','scripts/fixtures/cityExtinctionHarness.jsx','scripts/fixtures/city-extinction.html','.github/workflows/city-extinction-ui.yml'}
          assert len(m['files'])==11 and {f['path'] for f in m['files']}==allowed
          for f in m['files']:
              p=Path(f['path']);assert not p.is_symlink()
              h=hashlib.sha256(p.read_bytes()).hexdigest() if p.exists() else None
              assert h==f['before'],('Base mismatch',str(p))
          patch=payload['patch'].encode();assert hashlib.sha256(patch).hexdigest()==m['patchSha256']
          Path('/tmp/scene-reviewed.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero','--binary','/tmp/scene-reviewed.patch'],check=True)
          subprocess.run(['git','apply','--unidiff-zero','--binary','/tmp/scene-reviewed.patch'],check=True)
          for f in m['files']:assert hashlib.sha256(Path(f['path']).read_bytes()).hexdigest()==f['after'],f['path']
          (out/'source-manifest.json').write_text(json.dumps(m,indent=2))
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests, existing UI contracts, lint and source build
        run: |
          set -euo pipefail
          node --test --test-concurrency=1 scripts/sceneInputs.test.mjs scripts/extinctionTiming.test.mjs scripts/mosaicCityRuntime.test.mjs scripts/immersiveHubState.test.mjs | tee /tmp/scene-ui-evidence/unit.log
          npm run test:ui-immersion | tee /tmp/scene-ui-evidence/ui-contracts.log
          node node_modules/oxlint/bin/oxlint --max-warnings 0 src/components/HubScreen.jsx src/components/SceneHoldButton.jsx src/game/sceneInputs.js scripts/sceneInputs.test.mjs scripts/fixtures/cityExtinctionHarness.jsx scripts/immersiveHubState.test.mjs scripts/mosaicCityRuntime.test.mjs | tee /tmp/scene-ui-evidence/lint.log
          node node_modules/vite/bin/vite.js build | tee /tmp/scene-ui-evidence/source-build.log
      - name: Chromium with actual committed City and Extinction artwork
        run: |
          set -euo pipefail
          python3 -m venv /tmp/scene-playwright
          /tmp/scene-playwright/bin/pip install playwright==1.57.0
          /tmp/scene-playwright/bin/python -m playwright install --with-deps chromium
          node node_modules/vite/bin/vite.js --host 127.0.0.1 --port 4173 --strictPort >/tmp/scene-ui-evidence/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for n in $(seq 1 40); do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          /tmp/scene-playwright/bin/python scripts/browserCityExtinction.py --require-art --evidence /tmp/scene-ui-evidence/browser | tee /tmp/scene-ui-evidence/browser.log
      - name: Stage verified source blobs only; never move a reference
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,urllib.request
          from pathlib import Path
          m=json.loads(Path('/tmp/scene-ui-evidence/source-manifest.json').read_text());blobs=[]
          for f in m['files']:
              raw=Path(f['path']).read_bytes();assert hashlib.sha256(raw).hexdigest()==f['after']
              req=urllib.request.Request('https://api.github.com/repos/darknigthmare/multiverse-breach/git/blobs',data=json.dumps({'encoding':'base64','content':base64.b64encode(raw).decode()}).encode(),method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'scene-ui-review','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=30) as r:result=json.load(r)
              assert result['sha']==hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              blobs.append({'path':f['path'],'mode':'100644','type':'blob','sha':result['sha']})
          Path('/tmp/scene-ui-evidence/verified-blobs.json').write_text(json.dumps(blobs,indent=2))
          print('Verified source objects stored. No commit, ref update, merge or deployment performed.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: city-extinction-reviewed-${{ github.sha }}
          path: /tmp/scene-ui-evidence/
          retention-days: 14
